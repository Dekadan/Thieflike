<style>

  #wrap{display:flex;align-items:center;justify-content:center;height:100vh;background:#05060c}

<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<script>
'use strict';
document.title='Gölge Oyunu — Kuzgun (POV Prototip)';
// =====================================================================
//  GÖLGE OYUNU — Kuzgun | birinci şahıs (POV) prototip
//  Retro raycast render + Thief usulü ışık/ses/devriye sistemleri
//  İmza mekanik: FANUS — ışığı söndürmezsin, ÇALARSIN; istediğin yere
//  yeniden yerleştirirsin. Karanlık kazarsın, sahte ışıkla oyalarsın.
// =====================================================================
const TILE=16, W=480, H=270, HALF=H/2, MW=46, MH=30, GOAL=450;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

// ---------------- Dünya (Paşa Rüstem'in Konağı — kat planı) ----------------
let floorG, solidG, indoorG, doors, lights, loots, guards, bodies, projs, toasts, player, state, timeInMission, tension;
function idx(x,y){return y*MW+x;}
function buildWorld(){
  floorG=new Array(MW*MH).fill('g');
  solidG=new Uint8Array(MW*MH);
  const fillF=(x0,y0,x1,y1,f)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)floorG[idx(x,y)]=f;};
  const wallH=(x0,x1,y)=>{for(let x=x0;x<=x1;x++){solidG[idx(x,y)]=1;}};
  const wallV=(x,y0,y1)=>{for(let y=y0;y<=y1;y++){solidG[idx(x,y)]=1;}};
  wallH(0,MW-1,0); wallH(0,MW-1,MH-1); wallV(0,0,MH-1); wallV(MW-1,0,MH-1);
  fillF(4,7,15,13,'w');   // mutfak (gıcırtılı ahşap)
  fillF(17,7,28,21,'s');  // büyük hol
  fillF(30,7,41,13,'s');  // hazine odası
  fillF(4,15,15,21,'c');  // yemek odası (halı)
  fillF(30,15,41,21,'c'); // kütüphane (halı)
  fillF(21,23,23,28,'s'); // ön taş yol
  fillF(21,4,23,5,'s');   // arka taş eşik
  wallH(3,42,6); wallH(3,42,22); wallV(3,6,22); wallV(42,6,22);
  wallV(16,7,21); wallV(29,7,21); wallH(4,15,14); wallH(30,41,14);
  for(const [px,py] of [[19,11],[25,11],[19,17],[25,17]]) solidG[idx(px,py)]=2;
  indoorG=new Uint8Array(MW*MH);
  for(let y=6;y<=22;y++)for(let x=3;x<=42;x++)indoorG[idx(x,y)]=1;
  doors=[];
  const door=(x,y)=>{solidG[idx(x,y)]=0;floorG[idx(x,y)]='s';indoorG[idx(x,y)]=1;doors.push({x,y,open:false});};
  door(22,6); door(22,22); door(16,10); door(16,18); door(29,18);
  door(9,14); door(35,14); door(3,17);
  lights=[
    L(12,24,'torch',4.2), L(32,24,'torch',4.2), L(21,23,'lantern',4.5),
    L(22,9,'lantern',5), L(22,14,'lantern',5), L(22,19,'lantern',5),
    L(6,9,'candle',3.2), L(7,17,'candle',3.2), L(12,19,'candle',3.2),
    L(33,17,'candle',3.2), L(39,20,'candle',3.2),
    L(37,8,'lantern',5.2),
    L(14,3,'torch',4.2), L(30,3,'torch',4.2)
  ];
  function L(x,y,type,r){return {x,y,type,r,on:true,fl:Math.random()*7};}
  loots=[
    LT(5,16,'Gümüş şamdan',60), LT(12,17,'Sedef kakma kâse',45), LT(8,20,'İpek kese',35),
    LT(5,8,'Bakır cezve',25), LT(12,8,'Gümüş kaşık takımı',40),
    LT(22,13,'Mine işli vazo',55),
    LT(32,16,'Tombak divit',50), LT(40,21,'Enfiye kutusu',55), LT(36,17,'Kehribar ağızlık',45),
    LT(34,8,'Paşanın mühürlü kesesi',150,true), LT(39,8,'Zümrüt broş',120,true), LT(40,12,'Cep saati',75),
    LT(18,2,'Çeşme yüzüğü',35), LT(2,14,'Düşmüş kese',30)
  ];
  function LT(x,y,name,val,big){return {x,y,name,val,big:!!big,taken:false};}
  guards=[
    G([[6,25],[39,25]]),
    G([[18,9],[26,9],[26,20],[18,20]]),
    G([[6,16],[13,16],[13,20],[6,20]]),
    G([[35,10]],true,Math.PI/2),
    G([[8,3],[36,3]])
  ];
  function G(wps,st,face){
    const p=wps[0];
    return {x:p[0]*TILE+8,y:p[1]*TILE+8,wps,wpi:0,static:!!st,post:[p[0]*TILE+8,p[1]*TILE+8],
      dir:face??0,scanBase:face??0,state:'patrol',meter:0,target:null,path:null,pi:0,
      scanT:0,loseT:0,repathT:0,stuckT:0,searchN:0,boost:1,bark:'',barkT:0,idleT:4+Math.random()*8,
      bob:Math.random()*7,scr:null};
  }
  bodies=[]; projs=[]; toasts=[];
  player={x:5*TILE+8,y:26*TILE+8,ang:-Math.PI/2,crouch:false,stepAcc:0,bobT:0,
    pebble:3,flames:0,loot:0,seen:0,ko:0,moving:false,channel:null};
  timeInMission=0; tension=false;
  computeLight();
}

// ---------------- Işık sistemi (karo bazlı; duvarlar keser) ----------------
let lightG;
function doorAt(x,y){for(const d of doors)if(d.x===x&&d.y===y)return d;return null;}
function losTile(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy;
  while(!(x0===x1&&y0===y1)){
    const e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}
    if(e2<dx){err+=dx;y0+=sy;}
    if(x0===x1&&y0===y1)break;
    if(solidG[idx(x0,y0)])return false;
    const d=doorAt(x0,y0); if(d&&!d.open)return false;
  }
  return true;
}
function computeLight(){
  lightG=new Float32Array(MW*MH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)
    lightG[idx(x,y)]=indoorG[idx(x,y)]?0.09:0.27; // iç loşluk / ay ışığı
  for(const li of lights){
    if(!li.on)continue;
    const R=Math.ceil(li.r);
    for(let y=li.y-R;y<=li.y+R;y++)for(let x=li.x-R;x<=li.x+R;x++){
      if(x<0||y<0||x>=MW||y>=MH)continue;
      const d=Math.hypot(x-li.x,y-li.y);
      if(d>li.r||!losTile(li.x,li.y,x,y))continue;
      lightG[idx(x,y)]=Math.min(1,lightG[idx(x,y)]+Math.pow(1-d/li.r,1.4));
    }
  }
}
function lightAtPx(px,py){
  const x=Math.floor(px/TILE),y=Math.floor(py/TILE);
  return (x<0||y<0||x>=MW||y>=MH)?0:lightG[idx(x,y)];
}
// ışık değişimini gören devriye şüphelenir (çalınan alev / beliren alev)
const APPEAR_BARKS=['Bu ışık da nereden çıktı?','Kim yaktı bunu?','Az önce karanlıktı orası...'];
function notifyLightChange(tx,ty,appeared){
  for(const g of guards){
    if(g.state!=='patrol'&&g.state!=='search')continue;
    if(Math.hypot(g.x-(tx*TILE+8),g.y-(ty*TILE+8))>115)continue;
    if(!losTile(Math.floor(g.x/TILE),Math.floor(g.y/TILE),tx,ty))continue;
    g.bark=appeared?APPEAR_BARKS[(Math.random()*APPEAR_BARKS.length)|0]
                   :BARKS.douse[(Math.random()*BARKS.douse.length)|0];
    g.barkT=2.6; hearNoise(g,tx*TILE+8,ty*TILE+8);
  }
}

// ---------------- Yol bulma (BFS; devriyeler kapı açar) ----------------
function findPath(sx,sy,tx,ty){
  sx=Math.floor(sx/TILE);sy=Math.floor(sy/TILE);tx=Math.floor(tx/TILE);ty=Math.floor(ty/TILE);
  if(sx===tx&&sy===ty)return [];
  const prev=new Int32Array(MW*MH).fill(-1), q=[idx(sx,sy)];
  prev[idx(sx,sy)]=idx(sx,sy);
  while(q.length){
    const cur=q.shift(), cx=cur%MW, cy=(cur-cx)/MW;
    for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+ox,ny=cy+oy;
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const ni=idx(nx,ny);
      if(solidG[ni]||prev[ni]!==-1)continue;
      prev[ni]=cur;
      if(nx===tx&&ny===ty){
        const path=[];let c=ni;
        while(c!==idx(sx,sy)){const x=c%MW,y=(c-x)/MW;path.push([x*TILE+8,y*TILE+8]);c=prev[c];}
        path.reverse();return path;
      }
      q.push(ni);
    }
  }
  return null;
}

// ---------------- Ses motoru ----------------
let AC=null, master=null, muted=false;
function audioInit(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
    const len=2*AC.sampleRate, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=210;
    const g=AC.createGain();g.gain.value=0.018;
    src.connect(f);f.connect(g);g.connect(master);src.start();
  }catch(e){}
}
function tone(fr,dur,type,vol,slide){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(fr,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noiseSfx(dur,vol,freq){
  if(!AC||muted)return;
  const len=Math.floor(dur*AC.sampleRate),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||700;
  const g=AC.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(master);s.start();
}
const SFX={
  step:(v,fl)=>noiseSfx(0.05,Math.min(0.24,0.05+v*0.0022),fl==='w'?900:500),
  loot:()=>{tone(660,0.09,'sine',0.16);setTimeout(()=>tone(990,0.13,'sine',0.14),70);},
  big:()=>{tone(523,0.1,'sine',0.16);setTimeout(()=>tone(784,0.1,'sine',0.15),80);setTimeout(()=>tone(1046,0.18,'sine',0.14),160);},
  suspect:()=>tone(300,0.14,'square',0.07,430),
  alert:()=>{tone(470,0.3,'sawtooth',0.14,190);noiseSfx(0.2,0.1,1200);},
  giveup:()=>tone(360,0.2,'square',0.05,240),
  steal:()=>{noiseSfx(0.25,0.1,2400);tone(880,0.2,'sine',0.06,1320);},
  place:()=>{noiseSfx(0.18,0.1,600);tone(220,0.15,'sine',0.08,330);},
  pebble:()=>tone(1300,0.04,'square',0.1),
  ko:()=>{tone(72,0.2,'sine',0.3,45);noiseSfx(0.1,0.08,300);},
  door:()=>tone(150,0.07,'square',0.08,110),
  throw:()=>noiseSfx(0.12,0.05,2000),
  win:()=>{[392,466,587,784].forEach((f,i)=>setTimeout(()=>tone(f,0.35,'sine',0.14),i*160));},
  lose:()=>{[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.4,'sawtooth',0.1),i*180));}
};

// ---------------- Devriye YZ (durum makinesi) ----------------
const BARKS={
  suspect:['Hı? Kim var orada?','Bir şey kımıldadı...','Şu sese bir bakayım.','Gölgemi gördüm sandım...'],
  alert:['HIRSIZ! Yakalayın!','Orada! Gördüm seni!','Dur! Kaçma bre!','Ases çağırın!'],
  search:['Nereye kayboldu bu?','Buralarda bir yerde...','Çık ortaya, sıçan!'],
  giveup:['Rüzgârdır... rüzgâr olsun.','Kedidir kedi.','Kafayı yiyeceğim bu gece.'],
  body:['Aman Bânî! Adam yatıyor!','Cinayet var! Silah başına!'],
  douse:['Fener mi söndü şimdi?','Kim karıştı ışığa?'],
  idle:['Çorbam soğudu, mum bitti...','Böcekbaşı duymasın, uyuyakalmışım.','Bu konakta hayalet var diyorlar.','Ah şu gece devriyeleri...','Maaş üç aydır gecikti zaten.']
};
function say(g,type){g.bark=BARKS[type][Math.floor(Math.random()*BARKS[type].length)];g.barkT=2.6;}
function setState(g,s){
  const was=g.state;g.state=s;
  if(s==='suspect'&&was!=='suspect'){say(g,'suspect');SFX.suspect();}
  if(s==='alert'&&was!=='alert'){say(g,'alert');SFX.alert();player.seen++;tension=true;}
  if(s==='search')say(g,'search');
}
function hearNoise(g,x,y){
  g.target=[x,y];g.path=findPath(g.x,g.y,x,y);g.pi=0;g.stuckT=0;
  if(g.state!=='suspect'){setState(g,'suspect');g.meter=Math.max(g.meter,0.45);}
}
function emitNoise(x,y,r){
  const sx=Math.floor(x/TILE),sy=Math.floor(y/TILE);
  for(const g of guards){
    if(g.state==='alert')continue;
    let eff=r;
    if(!losTile(sx,sy,Math.floor(g.x/TILE),Math.floor(g.y/TILE)))eff=r*0.5;
    if(Math.hypot(g.x-x,g.y-y)<=eff)hearNoise(g,x,y);
  }
}
function guardVision(g,tx,ty,crouched){
  const d=Math.hypot(tx-g.x,ty-g.y);
  const L=lightAtPx(tx,ty);
  let R=110*(0.2+0.8*L)*(crouched?0.72:1)*g.boost;
  if(g.state==='alert')R*=1.3;
  if(d>R)return 0;
  const fx=Math.cos(g.dir),fy=Math.sin(g.dir),vx=(tx-g.x)/(d||1),vy=(ty-g.y)/(d||1);
  if(fx*vx+fy*vy<Math.cos(0.75))return 0;
  if(!losTile(Math.floor(g.x/TILE),Math.floor(g.y/TILE),Math.floor(tx/TILE),Math.floor(ty/TILE)))return 0;
  return 1-d/R;
}
function moveAlong(g,speed,dt){
  if(!g.path||g.pi>=g.path.length)return true;
  const [tx,ty]=g.path[g.pi];
  const dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy);
  if(d<3){g.pi++;return g.pi>=g.path.length;}
  g.dir=Math.atan2(dy,dx);
  g.x+=dx/d*speed*dt;g.y+=dy/d*speed*dt;g.bob+=speed*dt*0.09;
  for(const dr of doors)if(!dr.open){
    if(Math.hypot(dr.x*TILE+8-g.x,dr.y*TILE+8-g.y)<14){dr.open=true;computeLight();SFX.door();}
  }
  return false;
}
function updateGuard(g,dt){
  const vis=guardVision(g,player.x,player.y,player.crouch);
  g.visNow=vis;
  if(vis>0){
    const rate=(0.55+vis*1.15)*(player.moving?1.45:0.85)*(g.state==='suspect'?1.7:1);
    g.meter=Math.min(1.2,g.meter+rate*dt);
    if(g.state==='alert'){g.loseT=0;g.lastSeen=[player.x,player.y];}
  }else g.meter=Math.max(0,g.meter-0.55*dt);
  if(g.meter>=1&&g.state!=='alert'){
    setState(g,'alert');g.lastSeen=[player.x,player.y];g.repathT=0;g.loseT=0;
  }else if(g.meter>=0.35&&g.state==='patrol'){
    g.target=[player.x,player.y];g.path=findPath(g.x,g.y,player.x,player.y);g.pi=0;
    setState(g,'suspect');g.scanT=0;
  }
  for(const b of bodies)if(!b.found&&guardVision(g,b.x,b.y,true)>0.15){
    b.found=true;say(g,'body');SFX.alert();g.boost=1.25;tension=true;
    g.target=[b.x,b.y];g.path=findPath(g.x,g.y,b.x,b.y);g.pi=0;setState(g,'suspect');g.meter=0.6;
  }
  if(g.state==='patrol'){
    g.idleT-=dt;
    if(g.idleT<0){g.idleT=7+Math.random()*9;if(Math.random()<0.6)say(g,'idle');}
    if(g.static){
      const d=Math.hypot(g.post[0]-g.x,g.post[1]-g.y);
      if(d>4){if(!g.path||g.pi>=g.path.length){g.path=findPath(g.x,g.y,g.post[0],g.post[1]);g.pi=0;}moveAlong(g,30,dt);}
      else g.dir=g.scanBase+Math.sin(timeInMission*0.7+g.bob)*0.65;
    }else{
      const wp=g.wps[g.wpi],tx=wp[0]*TILE+8,ty=wp[1]*TILE+8;
      if(!g.path||g.pi>=g.path.length){
        if(Math.hypot(tx-g.x,ty-g.y)<4){g.wpi=(g.wpi+1)%g.wps.length;const w2=g.wps[g.wpi];g.path=findPath(g.x,g.y,w2[0]*TILE+8,w2[1]*TILE+8);}
        else g.path=findPath(g.x,g.y,tx,ty);
        g.pi=0;
      }
      moveAlong(g,30*(tension?1.15:1),dt);
    }
  }
  else if(g.state==='suspect'){
    if(g.path&&g.pi<g.path.length){
      g.stuckT+=dt;
      if(moveAlong(g,42,dt)||g.stuckT>6)g.scanT=1.8;
    }else if(g.scanT>0){
      g.scanT-=dt;g.dir+=Math.sin(timeInMission*3.1)*0.09;
      if(g.scanT<=0){
        if(g.meter<0.3){say(g,'giveup');SFX.giveup();g.state='patrol';g.path=null;g.stuckT=0;}
        else g.scanT=1.2;
      }
    }else g.scanT=1.8;
  }
  else if(g.state==='alert'){
    g.repathT-=dt;
    if(g.repathT<=0){g.path=findPath(g.x,g.y,player.x,player.y);g.pi=0;g.repathT=0.5;}
    moveAlong(g,62,dt);
    if(vis<=0){g.loseT+=dt;if(g.loseT>2.6){setState(g,'search');g.searchN=0;g.path=findPath(g.x,g.y,g.lastSeen[0],g.lastSeen[1]);g.pi=0;g.meter=0.8;}}
    if(Math.hypot(g.x-player.x,g.y-player.y)<11){state='caught';SFX.lose();}
  }
  else if(g.state==='search'){
    if(!g.path||g.pi>=g.path.length){
      if(g.scanT>0){g.scanT-=dt;g.dir+=0.05;}
      else if(g.searchN<3){
        g.searchN++;g.scanT=1.1;
        const a=Math.random()*Math.PI*2,r=30+Math.random()*40;
        const nx=g.lastSeen[0]+Math.cos(a)*r,ny=g.lastSeen[1]+Math.sin(a)*r;
        const tX=Math.max(1,Math.min(MW-2,Math.floor(nx/TILE))),tY=Math.max(1,Math.min(MH-2,Math.floor(ny/TILE)));
        if(!solidG[idx(tX,tY)]){g.path=findPath(g.x,g.y,tX*TILE+8,tY*TILE+8);g.pi=0;}
      }else{
        say(g,'giveup');SFX.giveup();g.boost=Math.max(g.boost,1.15);
        g.state='patrol';g.path=null;g.meter=0;
      }
    }else moveAlong(g,46,dt);
    if(vis>0.4){setState(g,'alert');g.lastSeen=[player.x,player.y];}
  }
  if(g.barkT>0)g.barkT-=dt;
}

// ---------------- Girdi ----------------
const keys={};
addEventListener('keydown',e=>{
  audioInit();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','KeyE'].includes(e.code))e.preventDefault();
  if(keys[e.code])return; keys[e.code]=true;
  if(e.code==='KeyM'){muted=!muted;toast(muted?'Ses kapalı':'Ses açık','#8fa3bf');}
  if(state==='title'&&e.code==='Enter'){buildWorld();state='play';}
  else if(state==='play'){
    if(e.code==='KeyC')player.crouch=!player.crouch;
    if(e.code==='KeyE')startInteract();
    if(e.code==='Space')tryKO();
    if(e.code==='KeyQ')throwPebble();
    if(e.code==='KeyR'){buildWorld();state='play';}
  }
  else if(state==='caught'||state==='win'){
    if(e.code==='KeyR'){buildWorld();state='play';}

// ---------------- Oyuncu eylemleri ----------------
function toast(text,col){toasts.unshift({text,col:col||'#e8e0c8',t:2.6});if(toasts.length>4)toasts.pop();}
function lookVec(){return [Math.cos(player.ang),Math.sin(player.ang)];}
// bakılan yöndeki etkileşilebilir: {k:'loot'|'door'|'light', o, d}
function findTarget(){
  const [lx,ly]=lookVec(); let best=null,bs=-2;
  const cand=[];
  for(const l of loots)if(!l.taken)cand.push({k:'loot',o:l,x:l.x*TILE+8,y:l.y*TILE+8,rng:24});
  for(const d of doors)cand.push({k:'door',o:d,x:d.x*TILE+8,y:d.y*TILE+8,rng:28});
  for(const li of lights)if(li.on)cand.push({k:'light',o:li,x:li.x*TILE+8,y:li.y*TILE+8,rng:26});
  for(const c of cand){
    const dx=c.x-player.x,dy=c.y-player.y,d=Math.hypot(dx,dy);
    if(d>c.rng)continue;
    const dot=(dx*lx+dy*ly)/(d||1);
    if(dot<0.45)continue;
    if(!losTile(Math.floor(player.x/TILE),Math.floor(player.y/TILE),Math.floor(c.x/TILE),Math.floor(c.y/TILE))
       && !(c.k==='door'))continue;
    if(dot>bs){bs=dot;best=c;c.d=d;}
  }
  return best;
}
function startInteract(){
  const t=findTarget();
  if(!t)return;
  if(t.k==='loot'){
    t.o.taken=true;player.loot+=t.o.val;
    toast((t.o.big?'✦ ':'')+t.o.name+'  +'+t.o.val+' akçe','#ffd76a');
    t.o.big?SFX.big():SFX.loot();
    if(player.loot>=GOAL&&player.loot-t.o.val<GOAL)toast('Kese doldu! Kuzey bahçe kapısına...','#9fe3a1');
  }else if(t.k==='door'){
    t.o.open=!t.o.open;computeLight();SFX.door();
    emitNoise(t.o.x*TILE+8,t.o.y*TILE+8,26);
  }else if(t.k==='light'){
    if(player.flames>=2){toast('Fanus dolu — önce bir alevi bırak (SOL TIK)','#c46a5a');return;}
    player.channel={o:t.o,t:0}; // E basılı tutulurken alev çalınır
  }
}
function updateChannel(dt){
  const ch=player.channel;
  if(!ch)return;
  const o=ch.o;
  const d=Math.hypot(o.x*TILE+8-player.x,o.y*TILE+8-player.y);
  if(!keys.KeyE||!o.on||d>30||player.moving){player.channel=null;return;}
  ch.t+=dt;
  if(ch.t>=1.0){
    player.channel=null;player.flames++;
    if(o.type==='placed')lights.splice(lights.indexOf(o),1); else o.on=false;
    computeLight();SFX.steal();
    toast('Alev fanusta ('+player.flames+'/2)','#ffcf7a');
    notifyLightChange(o.x,o.y,false);
  }
}
function throwFlame(){
  if(player.flames<=0){toast('Fanus boş — bir alevin başında E bas','#c46a5a');return;}
  const [lx,ly]=lookVec();
  projs.push({x:player.x,y:player.y,dx:lx,dy:ly,left:8*TILE,kind:'flame',sp:190});
  player.flames--;SFX.throw();
}
function throwPebble(){
  if(player.pebble<=0){toast('Çakıl kalmadı','#c46a5a');return;}
  const [lx,ly]=lookVec();
  projs.push({x:player.x,y:player.y,dx:lx,dy:ly,left:9*TILE,kind:'pebble',sp:230});
  player.pebble--;SFX.throw();
}
function tryKO(){
  for(let i=0;i<guards.length;i++){
    const g=guards[i],d=Math.hypot(g.x-player.x,g.y-player.y);
    if(d>19)continue;
    const fx=Math.cos(g.dir),fy=Math.sin(g.dir);
    const tx=(player.x-g.x)/d,ty=(player.y-g.y)/d;
    if(g.state!=='alert'&&(fx*tx+fy*ty)<-0.2){
      bodies.push({x:g.x,y:g.y,found:false});
      guards.splice(i,1);player.ko++;SFX.ko();
      emitNoise(g.x,g.y,28);
      toast('Ases bayıltıldı','#8fa3bf');
      return;
    }else{setState(g,'alert');g.meter=1;return;}
  }
}
function circleFree(px,py,r){
  for(const [ox,oy] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,-r],[0,r],[-r,0],[r,0]]){
    const tx=Math.floor((px+ox)/TILE),ty=Math.floor((py+oy)/TILE);
    if(tx<0||ty<0||tx>=MW||ty>=MH)return false;
    if(solidG[idx(tx,ty)])return false;
    const d=doorAt(tx,ty);if(d&&!d.open)return false;
  }
  return true;
}
const FLOOR_NOISE={g:{c:4,w:9,r:24},c:{c:5,w:11,r:28},s:{c:9,w:20,r:56},w:{c:20,w:38,r:84}};
function updatePlayer(dt){
  let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp)f+=1;
  if(keys.KeyS||keys.ArrowDown)f-=1;
  if(keys.KeyA)s-=1;
  if(keys.KeyD)s+=1;
  if(keys.ArrowLeft)player.ang-=2.6*dt;
  if(keys.ArrowRight)player.ang+=2.6*dt;
  const run=(keys.ShiftLeft||keys.ShiftRight)&&!player.crouch;
  const sp=player.crouch?27:run?80:47;
  player.moving=false;
  if(f||s){
    const [lx,ly]=lookVec();
    let dx=lx*f+(-ly)*s, dy=ly*f+lx*s; // ileri + yan (sağ = +90°)
    const m=Math.hypot(dx,dy);dx/=m;dy/=m;
    player.moving=true;player.bobT+=dt*(run?13:8);
    const nx=player.x+dx*sp*dt,ny=player.y+dy*sp*dt;
    if(circleFree(nx,player.y,4))player.x=nx;
    if(circleFree(player.x,ny,4))player.y=ny;
    player.stepAcc+=sp*dt;
    const need=player.crouch?15:run?10:13;
    if(player.stepAcc>=need){
      player.stepAcc=0;
      const fl=floorG[idx(Math.floor(player.x/TILE),Math.floor(player.y/TILE))];
      const nr=FLOOR_NOISE[fl][player.crouch?'c':run?'r':'w'];
      emitNoise(player.x,player.y,nr);
      SFX.step(nr,fl);
    }
  }
  const tx=Math.floor(player.x/TILE),ty=Math.floor(player.y/TILE);
  if(player.loot>=GOAL&&tx>=38&&tx<=40&&ty>=1&&ty<=2){state='win';SFX.win();}
}
function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i],adv=Math.min(p.sp*dt,p.left);
    const nx=p.x+p.dx*adv,ny=p.y+p.dy*adv;
    const tX=Math.floor(nx/TILE),tY=Math.floor(ny/TILE);
    const dr=doorAt(tX,tY);
    const hitWall=solidG[idx(tX,tY)]||(dr&&!dr.open);
    if(hitWall||((p.left-=adv)<=0.5)){
      const lx=hitWall?p.x:nx,ly=hitWall?p.y:ny;
      if(p.kind==='pebble'){SFX.pebble();emitNoise(lx,ly,85);}
      else{ // alev yerleşir: yeni ışık kaynağı
        const fx=Math.floor(lx/TILE),fy=Math.floor(ly/TILE);
        lights.push({x:fx,y:fy,type:'placed',r:4,on:true,fl:Math.random()*7});
        computeLight();SFX.place();
        emitNoise(lx,ly,20);
        notifyLightChange(fx,fy,true);
      }
      projs.splice(i,1);
    }else{p.x=nx;p.y=ny;}
  }
  for(let i=toasts.length-1;i>=0;i--){toasts[i].t-=dt;if(toasts[i].t<=0)toasts.splice(i,1);}
}

// ---------------- Raycast render ----------------
const img=ctx.createImageData(W,H);
const buf=new Uint32Array(img.data.buffer);
const zbuf=new Float32Array(W);
const FLOOR_RGB={s:[46,49,70],c:[84,34,46],w:[70,51,31],g:[27,41,31]};
function shadePx(r,g,b,L,dist,side){
  let br=(0.14+0.86*L)*Math.max(0.24,Math.min(1,1.18-dist/16));
  br=Math.round(br*8)/8;
  if(side)br*=0.82;
  const rr=Math.min(255,r*br*1.07),gg=Math.min(255,g*br*0.99),bb=Math.min(255,b*(br*0.9+0.05));
  return (255<<24)|(bb<<16)|(gg<<8)|rr;
}
function render3D(){
  const px=player.x/TILE, py=player.y/TILE;
  const dirX=Math.cos(player.ang),dirY=Math.sin(player.ang);
  const planeX=-dirY*0.66, planeY=dirX*0.66;
  const eye=player.crouch?0.36:0.5;
  const bobY=player.moving?Math.sin(player.bobT)*2:0;
  const horizon=HALF+bobY;
  // gökyüzü/tavan ve zemin — sütun bazlı taramada dolduruluyor
  for(let x=0;x<W;x++){
    const camX=2*x/W-1;
    const rdx=dirX+planeX*camX, rdy=dirY+planeY*camX;
    let mapX=Math.floor(px),mapY=Math.floor(py);
    const ddx=Math.abs(1/(rdx||1e-9)),ddy=Math.abs(1/(rdy||1e-9));
    let stepX,stepY,sdx,sdy;
    if(rdx<0){stepX=-1;sdx=(px-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-px)*ddx;}
    if(rdy<0){stepY=-1;sdy=(py-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-py)*ddy;}
    let side=0,hit=0,tex=null,doorCell=null,prevX=mapX,prevY=mapY,guard=0;
    while(!hit&&guard++<64){
      prevX=mapX;prevY=mapY;
      if(sdx<sdy){sdx+=ddx;mapX+=stepX;side=0;}else{sdy+=ddy;mapY+=stepY;side=1;}
      const s=solidG[idx(mapX,mapY)];
      if(s){hit=1;tex=(mapY===0&&mapX>=38&&mapX<=40)?TXD.gate:TXD[s];}
      else{const d=doorAt(mapX,mapY);if(d&&!d.open){hit=1;tex=TXD.door;doorCell=d;}}
    }
    const perp=side?(sdy-ddy):(sdx-ddx);
    const dist=Math.max(0.04,perp);
    zbuf[x]=dist;
    const lineH=H/dist;
    let wTop=horizon-lineH*(1-eye), wBot=horizon+lineH*eye;
    // duvarın ışığı: önündeki hücrenin ışığı
    const Lw=lightG[idx(prevX,prevY)];
    let wallX=side?px+perp*rdx:py+perp*rdy; wallX-=Math.floor(wallX);
    let texX=(wallX*T)|0; if((side===0&&rdx>0)||(side===1&&rdy<0))texX=T-texX-1;
    const y0=Math.max(0,wTop|0), y1=Math.min(H-1,wBot|0);
    // tavan / gök (duvar üstü)
    for(let y=0;y<y0;y++){
      const rowD=( (1-eye)*H )/(horizon-y||1e-4);
      const wx=px+rdx*rowD, wy=py+rdy*rowD;
      const cx=wx|0, cy=wy|0;
      let col;
      if(cx<0||cy<0||cx>=MW||cy>=MH||!indoorG[idx(cx,cy)]){
        // gece göğü: ufka doğru ay pusu + yıldız serpintisi
        const hz=Math.max(0,1-(horizon-y)/horizon);
        const sr=(10+22*hz)|0, sg=(13+28*hz)|0, sb=(24+42*hz)|0;
        col=(255<<24)|(sb<<16)|(sg<<8)|sr;
        const st2=hash((wx*7)|0,(wy*7)|0);
        if(st2>0.992){const b2=st2>0.997?230:150;col=(255<<24)|(b2<<16)|(b2<<8)|(b2-10);}
      }else{
        const L2=lightG[idx(cx,cy)];
        col=shadePx(25,21,39,L2*0.7,rowD,0);
      }
      buf[y*W+x]=col;
    }
    // duvar
    const texD=tex, step=T/(wBot-wTop);
    let tPos=(y0-wTop)*step;
    for(let y=y0;y<=y1;y++){
      const tY=Math.min(T-1,tPos|0);tPos+=step;
      const ti=(tY*T+texX)*4;
      buf[y*W+x]=shadePx(texD[ti],texD[ti+1],texD[ti+2],Lw,dist,side);
    }
    // zemin (duvar altı)
    for(let y=y1+1;y<H;y++){
      const rowD=(eye*H)/(y-horizon||1e-4);
      const wx=px+rdx*rowD, wy=py+rdy*rowD;
      const cx=wx|0, cy=wy|0;
      if(cx<0||cy<0||cx>=MW||cy>=MH){buf[y*W+x]=(255<<24)|(20<<16)|(11<<8)|9;continue;}
      const f=FLOOR_RGB[floorG[idx(cx,cy)]]||FLOOR_RGB.s;
      const L2=lightG[idx(cx,cy)];
      const n=hash(cx,cy)>0.5?1.06:1;
      buf[y*W+x]=shadePx(f[0]*n,f[1]*n,f[2]*n,L2,rowD,0);
    }
  }
  ctx.putImageData(img,0,0);
  // ---- sprite'lar (uzak → yakın) ----
  const dir={x:dirX,y:dirY},pl={x:planeX,y:planeY};
  const ents=[];
  for(const li of lights){
    const sp=li.on?sprFlames[li.type][((timeInMission*8)|0)%2]:(li.type!=='placed'?sprDark:null);
    if(sp)ents.push({sp,x:li.x*TILE+8,y:li.y*TILE+8,h:li.type==='torch'?0.5:li.type==='candle'?0.3:0.42,vOff:li.type==='candle'?0.22:0.3,lit:li.on?1:0});
  }
  for(const l of loots)if(!l.taken)ents.push({sp:sprLoot[((timeInMission*5)|0)%2],x:l.x*TILE+8,y:l.y*TILE+8,h:0.26,vOff:0.02,lit:0.6});
  for(const b of bodies)ents.push({sp:sprBody,x:b.x,y:b.y,h:0.3,vOff:0,wide:1});
  for(const g of guards)ents.push({sp:sprGuard,x:g.x,y:g.y,h:0.86,vOff:0,g});
  for(const p of projs)ents.push({sp:p.kind==='pebble'?sprPebble:sprFire,x:p.x,y:p.y,h:0.14,vOff:0.3,lit:p.kind==='flame'?1:0.4});
  for(const e of ents){
    const dx=(e.x-player.x)/TILE, dy=(e.y-player.y)/TILE;
    const inv=1/(pl.x*dir.y-dir.x*pl.y);
    const trX=inv*(dir.y*dx-dir.x*dy);   // yanal
    const trY=inv*(-pl.y*dx+pl.x*dy);    // derinlik
    e.depth=trY;
    e.sx=(W/2)*(1+trX/trY);
  }
  ents.sort((a,b)=>b.depth-a.depth);
  for(const e of ents){
    if(e.depth<=0.08)continue;
    const wallH2=H/e.depth;
    const sh=wallH2*e.h;
    const sw=sh*(e.sp.width/e.sp.height)*(e.wide?1.6:1);
    const bot=horizon+wallH2*eye - wallH2*e.vOff;
    const top=bot-sh;
    const x0=Math.max(0,(e.sx-sw/2)|0), x1=Math.min(W-1,(e.sx+sw/2)|0);
    if(x1<x0)continue;
    const L=e.lit!==undefined?Math.max(e.lit,lightAtPx(e.x,e.y)):lightAtPx(e.x,e.y);
    const dark=Math.max(0,Math.min(0.85,1-(0.2+0.8*L)));
    let drawn=false;
    for(let x=x0;x<=x1;x++){
      if(zbuf[x]<=e.depth)continue;
      const tx=((x-(e.sx-sw/2))/sw*e.sp.width)|0;
      ctx.drawImage(e.sp,tx,0,1,e.sp.height,x,top,1,sh);
      if(dark>0.02){ctx.fillStyle='rgba(6,8,18,'+dark+')';ctx.fillRect(x,top,1,sh);}
      drawn=true;
    }
    if(e.g){e.g.scr=drawn?{x:e.sx,top,depth:e.depth}:null;}
  }
}

// ---------------- HUD + üst katman ----------------
function drawHUD(){
  // devriye lafları (dünya-bağlı)
  ctx.textAlign='center';
  for(const g of guards){
    if(!g.scr)continue;
    if(g.state==='suspect'||g.state==='search'){ctx.fillStyle='#ffd75e';ctx.font='bold 10px monospace';ctx.fillText('?',g.scr.x,g.scr.top-4);}
    if(g.state==='alert'){ctx.fillStyle='#ff5040';ctx.font='bold 11px monospace';ctx.fillText('!',g.scr.x,g.scr.top-4);}
    if(g.barkT>0&&g.bark&&g.scr.depth<9){
      ctx.font='7px monospace';
      const w2=ctx.measureText(g.bark).width+6;
      ctx.fillStyle='rgba(8,8,14,0.72)';ctx.fillRect(g.scr.x-w2/2,g.scr.top-22,w2,10);
      ctx.fillStyle='#e8e0c8';ctx.fillText(g.bark,g.scr.x,g.scr.top-14.5);
    }
  }
  // fark edilme ibresi (crosshair üstü)
  let mx=0;for(const g of guards)mx=Math.max(mx,g.visNow>0?g.meter:0);
  if(mx>0.03){
    ctx.fillStyle='rgba(8,8,14,0.6)';ctx.fillRect(W/2-16,HALF-18,32,4);
    ctx.fillStyle=mx>0.7?'#ff5040':'#ffd75e';ctx.fillRect(W/2-15,HALF-17,30*Math.min(1,mx),2);
  }
  // alarm kızıllığı
  if(guards.some(g=>g.state==='alert')){
    const p=0.5+0.5*Math.sin(timeInMission*6);
    ctx.fillStyle='rgba(255,50,30,'+(0.05+0.06*p)+')';ctx.fillRect(0,0,W,H);
  }
  // crosshair
  ctx.fillStyle='rgba(232,224,200,0.7)';ctx.fillRect(W/2-1,HALF-1,2,2);
  // etkileşim ipucu / kanal çubuğu
  const t=findTarget();
  ctx.font='8px monospace';ctx.textAlign='center';
  if(player.channel){
    ctx.fillStyle='rgba(8,8,14,0.72)';ctx.fillRect(W/2-42,HALF+10,84,14);
    ctx.fillStyle='#5d6b84';ctx.fillRect(W/2-38,HALF+18,76,3);
    ctx.fillStyle='#ffcf7a';ctx.fillRect(W/2-38,HALF+18,76*Math.min(1,player.channel.t),3);
    ctx.fillStyle='#ffe9a8';ctx.fillText('alevi çalıyorsun...',W/2,HALF+17);
  }else if(t){
    let txt = t.k==='loot' ? 'E — '+t.o.name+' ('+t.o.val+')'
            : t.k==='door' ? (t.o.open?'E — kapıyı kapa':'E — kapıyı aç')
            : (player.flames>=2?'Fanus dolu':'E basılı tut — alevi fanusla ÇAL');
    const w2=ctx.measureText(txt).width+8;
    ctx.fillStyle='rgba(8,8,14,0.72)';ctx.fillRect(W/2-w2/2,HALF+10,w2,12);
    ctx.fillStyle='#e8e0c8';ctx.fillText(txt,W/2,HALF+19);
  }
  // fanus (sağ el) — içindeki alevler gerçek zamanlı yanar
  const bob=player.moving?Math.sin(player.bobT)*3:0;
  const fx=W-74,fy=H-58+bob;
  ctx.fillStyle='#2c2740';ctx.fillRect(fx+14,fy+34,26,8);      // el/kol gölgesi
  ctx.fillStyle='#8a6b3a';ctx.fillRect(fx+10,fy+28,34,6);      // pirinç taban
  ctx.strokeStyle='rgba(180,200,230,0.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(fx+27,fy+18,16,Math.PI,0);ctx.stroke(); // cam kubbe
  ctx.strokeStyle='rgba(180,200,230,0.25)';
  ctx.beginPath();ctx.arc(fx+27,fy+18,16,0,Math.PI);ctx.stroke();
  ctx.fillStyle='#8a6b3a';ctx.fillRect(fx+24,fy-2,6,4);        // halka
  for(let i=0;i<player.flames;i++){
    const flick=Math.sin(timeInMission*11+i*3)*1.5;
    ctx.fillStyle='#ffb347';ctx.fillRect(fx+19+i*10,fy+12+flick,5,9-flick);
    ctx.fillStyle='#ffe9a8';ctx.fillRect(fx+20+i*10,fy+15+flick,3,5);
  }
  if(player.flames>0){ // fanusun ışığı ele vurur
    ctx.fillStyle='rgba(255,176,80,0.07)';ctx.beginPath();ctx.arc(fx+27,fy+16,34,0,7);ctx.fill();
  }
  // alt bar
  ctx.fillStyle='rgba(6,8,16,0.78)';ctx.fillRect(0,H-20,W,20);
  ctx.fillStyle='#2a3247';ctx.fillRect(0,H-20,W,1);
  ctx.font='bold 9px monospace';ctx.textAlign='left';
  ctx.fillStyle='#ffd76a';ctx.fillText('◆ '+player.loot+' / '+GOAL+' akçe',6,H-7);
  // ışık taşı
  const L=lightAtPx(player.x,player.y);
  const gx=W/2,gy=H-13;
  ctx.save();ctx.translate(gx,gy);ctx.rotate(Math.PI/4);
  ctx.fillStyle='rgb('+((20+L*225)|0)+','+((18+L*215)|0)+','+((30+L*150)|0)+')';
  ctx.fillRect(-5,-5,10,10);
  ctx.strokeStyle='#8fa3bf';ctx.lineWidth=1;ctx.strokeRect(-5.5,-5.5,11,11);
  ctx.restore();
  ctx.font='7px monospace';ctx.textAlign='center';ctx.fillStyle='#5d6b84';
  ctx.fillText(L<0.24?'gölgedesin':L<0.55?'yarı gölge':'IŞIKTASIN',gx,H-2.5);
  ctx.font='bold 9px monospace';ctx.textAlign='right';
  ctx.fillStyle=player.flames>0?'#ffcf7a':'#4a4a55';
  ctx.fillText('🔥 fanus '+player.flames+'/2',W-96,H-7);
  ctx.fillStyle=player.pebble>0?'#b9b9c9':'#4a4a55';
  ctx.fillText('● çakıl '+player.pebble,W-8,H-7);
  ctx.font='8px monospace';ctx.textAlign='left';ctx.fillStyle='rgba(160,175,200,0.75)';
  ctx.fillText(player.loot>=GOAL?'Kuzeydeki bahçe kapısına git! (TAB: harita)':'Görev: '+GOAL+' akçe topla (TAB: harita)',6,10);
  if(!document.pointerLockElement){
    ctx.textAlign='center';ctx.fillStyle='#ffd76a';
    ctx.fillText('— fareyle bakmak için TIKLA —',W/2,22);
  }
  // bildirimler
  ctx.textAlign='center';ctx.font='8px monospace';
  toasts.forEach((t2,i)=>{
    const w2=ctx.measureText(t2.text).width+8;
    ctx.fillStyle='rgba(8,8,14,'+Math.min(0.75,t2.t)+')';
    ctx.fillRect(W/2-w2/2,H-60-i*13,w2,12);
    ctx.globalAlpha=Math.min(1,t2.t);
    ctx.fillStyle=t2.col;ctx.fillText(t2.text,W/2,H-51-i*13);
    ctx.globalAlpha=1;
  });
  // harita (TAB)
  if(keys.Tab){
    const sc=4,ox=W-MW*sc-8,oy=26;
    ctx.fillStyle='rgba(10,10,18,0.88)';ctx.fillRect(ox-4,oy-4,MW*sc+8,MH*sc+8);
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
      const s=solidG[idx(x,y)];
      if(s)ctx.fillStyle='#5d5478';
      else{const f=floorG[idx(x,y)];ctx.fillStyle=f==='c'?'#4a2230':f==='w'?'#3c2d1c':f==='g'?'#1c2b20':'#262a3d';}
      ctx.fillRect(ox+x*sc,oy+y*sc,sc,sc);
    }
    for(const d of doors){ctx.fillStyle=d.open?'#8a6b3a':'#5a3d1e';ctx.fillRect(ox+d.x*sc,oy+d.y*sc,sc,sc);}
    ctx.fillStyle='#9fe3a1';ctx.fillRect(ox+38*sc,oy+1*sc,3*sc,2*sc);
    const pxm=ox+player.x/TILE*sc, pym=oy+player.y/TILE*sc;
    ctx.fillStyle='#ffe9a8';
    ctx.beginPath();
    ctx.moveTo(pxm+Math.cos(player.ang)*5,pym+Math.sin(player.ang)*5);
    ctx.lineTo(pxm+Math.cos(player.ang+2.5)*3.5,pym+Math.sin(player.ang+2.5)*3.5);
    ctx.lineTo(pxm+Math.cos(player.ang-2.5)*3.5,pym+Math.sin(player.ang-2.5)*3.5);
    ctx.closePath();ctx.fill();
  }
}

// ---------------- Ekranlar ----------------
function drawSky(t){
  ctx.fillStyle='#0b0e1a';ctx.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){
    const x=(hash(i,7)*W)|0,y=(hash(i,13)*150)|0;
    ctx.fillStyle='rgba(200,215,255,'+(0.15+0.5*Math.abs(Math.sin(t*0.7+i)))+')';
    ctx.fillRect(x,y,1,1);
  }
  ctx.fillStyle='#e8e4d0';ctx.beginPath();ctx.arc(38,40,17,0,7);ctx.fill();
  ctx.fillStyle='#0b0e1a';ctx.beginPath();ctx.arc(32,35,14,0,7);ctx.fill();
  ctx.fillStyle='#161430';
  const hs=[190,178,196,170,186,200,174,182,192,168,188,196];
  hs.forEach((h2,i)=>ctx.fillRect(i*40,h2,42,H-h2));
  hs.forEach((h2,i)=>{ctx.fillStyle='#221f42';ctx.fillRect(i*40,h2,42,2);ctx.fillStyle='#161430';});
  ctx.fillStyle='#1c1936';ctx.fillRect(444,104,26,140);
  ctx.fillStyle='#262148';ctx.fillRect(441,96,32,10);
  ctx.fillStyle='#ffcf7a';ctx.beginPath();ctx.arc(457,126,8,0,7);ctx.fill();
  ctx.strokeStyle='#3a2c18';ctx.lineWidth=1;ctx.beginPath();
  ctx.moveTo(457,126);ctx.lineTo(457,120);ctx.moveTo(457,126);ctx.lineTo(461,128);ctx.stroke();
  for(let i=0;i<14;i++){
    const x=(hash(i,31)*W)|0,y=190+((hash(i,37)*60)|0);
    ctx.fillStyle='rgba(255,176,80,'+(0.3+0.4*hash(i,3))+')';
    ctx.fillRect(x,y,2,3);
  }
  ctx.fillStyle='rgba(10,12,24,0.5)';ctx.fillRect(0,150,W,40);
}
function drawTitle(t){
  drawSky(t);
  ctx.textAlign='center';
  ctx.fillStyle='#0a0c16';ctx.fillRect(60,22,360,58);
  ctx.strokeStyle='#3a3350';ctx.lineWidth=1;ctx.strokeRect(60.5,22.5,359,57);
  ctx.fillStyle='#e8e0c8';ctx.font='bold 26px monospace';
  ctx.fillText('GÖLGE OYUNU',W/2,48);
  ctx.fillStyle='#ffb347';ctx.font='bold 10px monospace';
  ctx.fillText('— K U Z G U N —   birinci şahıs prototip',W/2,66);
  ctx.font='8px monospace';ctx.fillStyle='#9aa7bd';
  const lore=['Sayeban\'da gece iki tür insana aittir: aseslere ve benim gibilere.',
              'Paşa Rüstem\'in konağı bu gece kalabalık; kesesi de öyle.',
              'Ve unutma: ışık düşmanın değil, MALINDIR. Çal onu.'];
  lore.forEach((l,i)=>ctx.fillText(l,W/2,92+i*11));
  ctx.fillStyle='#c8d2e8';
  const ctr=['FARE — bak (tıklayıp kilitle) · WASD — yürü · SHIFT koş · C çömel',
             'E — al / kapı · E BASILI TUT — alevi fanusla ÇAL · SOL TIK — alevi bırak',
             'SAĞ TIK / Q — çakıl fırlat · SPACE — arkadan bayılt',
             'TAB — harita · M — ses · R — yeniden başla'];
  ctr.forEach((l,i)=>ctx.fillText(l,W/2,134+i*11));
  ctx.fillStyle='#ffcf7a';ctx.font='8px monospace';
  ctx.fillText('FANUS: Çaldığın alev söner; bıraktığın yerde yeniden yanar.',W/2,186);
  ctx.fillText('Karanlığı kendin kaz; sahte ışıkla asesleri oyala.',W/2,196);
  if(Math.sin(t*4)>-0.2){
    ctx.fillStyle='#ffd76a';ctx.font='bold 11px monospace';
    ctx.fillText('— ENTER: Geceye Başla —',W/2,218);
  }
  ctx.fillStyle='#5d6b84';ctx.font='7px monospace';
  ctx.fillText('Thief: The Dark Project ruhuyla · Karagöz\'ün perdesinden · klavye+fare gerekir',W/2,244);
}
function drawEnd(win,t){
  ctx.fillStyle=win?'rgba(8,14,10,0.88)':'rgba(18,6,8,0.88)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=win?'#9fe3a1':'#ff5040';ctx.font='bold 22px monospace';
  ctx.fillText(win?'SIRRA KADEM BASTIN':'YAKALANDIN',W/2,70);
  ctx.fillStyle='#9aa7bd';ctx.font='8px monospace';
  ctx.fillText(win?'"Paşa sabaha kadar fark etmez. Sabah da... benim meselem değil."'
                  :'"Böcekbaşı seninle bizzat ilgilenecekmiş. Ne şeref." — Ases',W/2,90);
  ctx.fillStyle='#e8e0c8';ctx.font='9px monospace';
  const mins=Math.floor(timeInMission/60),secs=Math.floor(timeInMission%60);
  const total=loots.reduce((a,l)=>a+l.val,0);
  ['Çalınan: '+player.loot+' / '+total+' akçe',
   'Süre: '+mins+' dk '+secs+' sn',
   'Alarm: '+player.seen+' kez  ·  Bayıltma: '+player.ko
  ].forEach((r,i)=>ctx.fillText(r,W/2,118+i*13));
  if(win){
    const rank=player.seen===0&&player.ko===0?'HAYALET':player.seen===0?'GÖLGE':player.seen<=2?'KUZGUN':'ACEMİ ÇIRAK';
    ctx.fillStyle='#ffd76a';ctx.font='bold 13px monospace';
    ctx.fillText('Derece: '+rank,W/2,170);
    ctx.fillStyle='#5d6b84';ctx.font='7px monospace';
    ctx.fillText(rank==='HAYALET'?'Hiç görülmedin, kimseye dokunmadın. Ustalık budur.':
                 rank==='GÖLGE'?'Görülmedin. Bir dahaki sefere ellerin de temiz kalsın.':
                 rank==='KUZGUN'?'İş bitti ama izin kaldı. Kuzgun daha iyisini yapar.':
                 'Gürültülü bir geceydi. Sansar duysa güler.',W/2,184);
  }
  ctx.fillStyle='#c8d2e8';ctx.font='9px monospace';
  ctx.fillText('R — tekrar dene    ENTER — başlık',W/2,212);
}

// ---------------- Ana döngü ----------------
state='title';
let last=0;
function frame(ts){
  const t=ts/1000, dt=Math.min(0.033,(ts-last)/1000||0.016);
  last=ts;
  if(state==='play'){
    timeInMission+=dt;
    updatePlayer(dt);
    updateChannel(dt);
    for(const g of guards)updateGuard(g,dt);
    updateProjs(dt);
    render3D();
    drawHUD();
  }else if(state==='title'){
    drawTitle(t);
  }else{
    render3D();
    drawEnd(state==='win',t);
  }
  requestAnimationFrame(frame);
}
buildWorld();
requestAnimationFrame(frame);
</script>
