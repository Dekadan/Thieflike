<script>
'use strict';
document.title='Gölge Oyunu — Kuzgun (3D Prototip)';
// =====================================================================
//  GÖLGE OYUNU — Kuzgun | birinci şahıs 3D prototip (WebGL, bağımsız)
//  v2 "Konak Gecesi": dokulu low-poly devriyeler (zırh gömlek + kaftan +
//  börk, diz/dirsek animasyonu, asa & kılıç), pencerelerden ay ışığı,
//  mobilyalı odalar, şadırvanlı avlu, selviler, mazgallı sur; çift
//  kanallı ışık (kandil sıcak / ay soğuk) + alev titremesi; konumsal
//  ses: rüzgâr, cırcır, ocak çıtırtısı, liman çanı, makam dronu,
//  devriye adımı ve asa tak-tak telegrafı (bkz. docs/04 §6).
//  İmza mekanik: FANUS — ışığı çal, taşı, yeniden yak.
// =====================================================================
const TILE=16, MW=46, MH=30, GOAL=450;
const WALL_H=1.5, EYE=0.95, EYE_CROUCH=0.6;
let BRIGHT=1.15; // görsel parlaklık (1/2 tuşları; oyun dengesini etkilemez)
try{ BRIGHT=Math.min(1.9,Math.max(0.7,parseFloat(localStorage.getItem('golge_bright'))||1.15)); }catch(e){}
function setBright(d){
  BRIGHT=Math.min(1.9,Math.max(0.7,BRIGHT+d));
  try{ localStorage.setItem('golge_bright',BRIGHT); }catch(e){}
  toast('Parlaklık %'+Math.round(BRIGHT*100)+(BRIGHT>=1.9?' (azami)':BRIGHT<=0.7?' (asgari)':''),'#cbb98a');
}

// ---------------- Dünya (Paşa Rüstem'in Konağı) ----------------
let floorG, solidG, indoorG, doors, lights, moonLights, winSet, props, loots, guards, bodies, projs, toasts, player, state, timeInMission, tension;
function idx(x,y){return y*MW+x;}
function buildWorld(){
  floorG=new Array(MW*MH).fill('g');
  solidG=new Uint8Array(MW*MH);
  const fillF=(x0,y0,x1,y1,f)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)floorG[idx(x,y)]=f;};
  const wallH=(x0,x1,y)=>{for(let x=x0;x<=x1;x++)solidG[idx(x,y)]=1;};
  const wallV=(x,y0,y1)=>{for(let y=y0;y<=y1;y++)solidG[idx(x,y)]=1;};
  wallH(0,MW-1,0); wallH(0,MW-1,MH-1); wallV(0,0,MH-1); wallV(MW-1,0,MH-1);
  fillF(4,7,15,13,'w');   // mutfak (gıcırtılı ahşap)
  fillF(17,7,28,21,'s');  // büyük hol
  fillF(30,7,41,13,'s');  // hazine odası
  fillF(4,15,15,21,'c');  // yemek odası (halı)
  fillF(30,15,41,21,'c'); // kütüphane (halı)
  fillF(21,23,23,28,'s'); // ön taş yol
  fillF(21,4,23,5,'s');   // arka taş eşik
  wallH(3,42,6); wallH(3,42,22); wallV(3,6,22); wallV(42,6,22);
  wallV(16,7,21); wallV(29,7,21); wallH(4,15,14); wallH(30,41,14);
  for(const [px,py] of [[19,11],[25,11],[19,17],[25,17]]) solidG[idx(px,py)]=2;
  indoorG=new Uint8Array(MW*MH);
  for(let y=6;y<=22;y++)for(let x=3;x<=42;x++)indoorG[idx(x,y)]=1;
  doors=[];
  const door=(x,y)=>{
    solidG[idx(x,y)]=0;floorG[idx(x,y)]='s';indoorG[idx(x,y)]=1;
    doors.push({x,y,open:false,animT:0,horiz:solidG[idx(x-1,y)]===1||solidG[idx(x+1,y)]===1});
  };
  door(22,6); door(22,22); door(16,10); door(16,18); door(29,18);
  door(9,14); door(35,14); door(3,17);
  // Pencereler: kafesli kemerler; içeri soğuk ay havuzu düşürür (gizlilik kuralına dahil)
  winSet=new Set(); moonLights=[];
  const win=(x,y,ix,iy)=>{winSet.add(x+','+y);moonLights.push({x:ix,y:iy,type:'moon',r:2.4,on:true});};
  for(const wx of [8,12,26,33,39])win(wx,6,wx,7);
  for(const wx of [7,12,27,33,38])win(wx,22,wx,21);
  for(const wy of [9,12])win(3,wy,4,wy);
  for(const wy of [9,19])win(42,wy,41,wy);
  lights=[
    L(12,24,'torch',4.2), L(32,24,'torch',4.2), L(21,23,'lantern',4.5),
    L(22,9,'lantern',5), L(22,14,'lantern',5), L(22,19,'lantern',5),
    L(6,9,'candle',3.2), L(7,17,'candle',3.2), L(12,19,'candle',3.2),
    L(33,17,'candle',3.2,0.36), L(39,20,'candle',3.2),
    L(37,8,'lantern',5.2),
    L(14,3,'torch',4.2), L(30,3,'torch',4.2)
  ];
  function L(x,y,type,r,base){return {x,y,type,r,base:base||0,on:true,fl:Math.random()*7};}
  loots=[
    LT(5,16,'Gümüş şamdan',60), LT(12,17,'Sedef kakma kâse',45,false,0.30), LT(8,20,'İpek kese',35),
    LT(5,8,'Bakır cezve',25,false,0.46), LT(12,8,'Gümüş kaşık takımı',40),
    LT(22,13,'Mine işli vazo',55,false,0.54),
    LT(32,17,'Tombak divit',50,false,0.36), LT(40,21,'Enfiye kutusu',55,false,0.94), LT(36,17,'Kehribar ağızlık',45,false,0.08),
    LT(34,8,'Paşanın mühürlü kesesi',150,true,0.54), LT(39,8,'Zümrüt broş',120,true,0.54), LT(40,12,'Cep saati',75,false,0.44),
    LT(18,2,'Çeşme yüzüğü',35), LT(2,14,'Düşmüş kese',30)
  ];
  function LT(x,y,name,val,big,h){return {x,y,name,val,big:!!big,h:h||0,taken:false};}
  // Mobilya + bahçe (statik mesh verisi; solidP hem çarpışma hem görüş hattını kapatır)
  props=[];
  const P=(k,x,y,o)=>{props.push(Object.assign({k,x,y},o||{}));};
  const solidP=(x,y,v)=>{solidG[idx(x,y)]=v||5;};
  for(let x=5;x<=8;x++){P('counter',x,8);solidP(x,8);}
  P('pots',5,8);P('pots',7,8);
  P('barrel',14,8);solidP(14,8); P('barrel',14,9);solidP(14,9);
  P('table',9,17,{x1:12});for(let x=9;x<=12;x++)solidP(x,17);
  for(const [cx,cy] of [[8,17],[9,18],[11,18],[12,18],[27,12],[27,15],[37,17],[38,19],[31,16]])P('cushion',cx,cy);
  for(const [dx,dy] of [[28,11],[28,12],[28,16],[28,17]]){P('divan',dx,dy);solidP(dx,dy);}
  P('desk',32,17,{x1:33});solidP(32,17);solidP(33,17);
  for(const [cx,cy] of [[36,9],[38,11],[40,12]]){P('chest',cx,cy);solidP(cx,cy);}
  for(const [cx,cy] of [[34,8],[39,8],[22,13]]){P('ped',cx,cy);solidP(cx,cy);}
  P('tshelf',40,21);solidP(40,21);
  for(let x=31;x<=34;x++)P('wshelf',x,21);
  for(let y=16;y<=18;y++)P('wshelfV',41,y);
  for(let y=8;y<=20;y++)for(let x=21;x<=23;x++)P('runner',x,y);
  for(let y=9;y<=11;y++)for(let x=33;x<=38;x++)P('rug',x,y);
  P('banner',29,9,{face:'w'});P('banner',29,13,{face:'w'});
  P('banner',16,12,{face:'e'});P('banner',16,15,{face:'e'});
  for(const [tx,ty] of [[2,2],[7,1],[37,1],[43,2],[1,13],[44,8],[44,20],[2,27],[9,27],[35,27],[43,27],[1,22]]){
    P('tree',tx,ty,{h:hashN(tx,ty)});solidP(tx,ty,3);
  }
  for(const [bx,by] of [[4,23],[15,23],[30,23],[41,23],[6,5],[18,5],[28,5],[37,5]])P('bush',bx,by);
  P('fountain',27,26);
  for(const [fx,fy] of [[27,26],[28,26],[27,27],[28,27]])solidP(fx,fy,4);
  guards=[
    G([[6,25],[39,25]]),
    G([[18,9],[26,9],[26,20],[18,20]]),
    G([[6,16],[13,16],[13,20],[6,20]]),
    G([[35,10]],true,Math.PI/2),
    G([[8,3],[36,3]])
  ];
  function G(wps,st,face){
    const p=wps[0];
    return {x:p[0]*TILE+8,y:p[1]*TILE+8,wps,wpi:0,static:!!st,post:[p[0]*TILE+8,p[1]*TILE+8],
      dir:face??0,scanBase:face??0,state:'patrol',meter:0,target:null,path:null,pi:0,
      scanT:0,loseT:0,repathT:0,stuckT:0,searchN:0,boost:1,bark:'',barkT:0,idleT:4+Math.random()*8,
      bob:Math.random()*7,moving:false,scr:null,visNow:0,poseT:0,stepA:0,tapN:0,tapT:2+Math.random()*3};
  }
  bodies=[]; projs=[]; toasts=[];
  player={x:5*TILE+8,y:26*TILE+8,ang:-Math.PI/2,pitch:0,crouch:false,stepAcc:0,bobT:0,
    pebble:3,flames:0,loot:0,seen:0,ko:0,moving:false,channel:null};
  timeInMission=0; tension=false;
  computeLight();
}

// ---------------- Işık sistemi (karo bazlı; oyun kuralı) ----------------
// Oyun kuralı lightG karo çözünürlüğünde kalır (denge aynı); görsel için
// 2× çözünürlükte iki kanal tutulur: sıcak (kandil) + soğuk (ay).
const LR=2, VW=MW*LR, VH=MH*LR;
let lightG, warmV, coolV;
function doorAt(x,y){for(const d of doors)if(d.x===x&&d.y===y)return d;return null;}
function losTile(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy;
  while(!(x0===x1&&y0===y1)){
    const e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}
    if(e2<dx){err+=dx;y0+=sy;}
    if(x0===x1&&y0===y1)break;
    if(solidG[idx(x0,y0)])return false;
    const d=doorAt(x0,y0); if(d&&!d.open)return false;
  }
  return true;
}
function computeLight(){
  lightG=new Float32Array(MW*MH);
  warmV=new Float32Array(VW*VH);
  coolV=new Float32Array(VW*VH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)
    lightG[idx(x,y)]=indoorG[idx(x,y)]?0.11:0.30;
  for(let y=0;y<VH;y++)for(let x=0;x<VW;x++){
    const o=y*VW+x;
    if(indoorG[idx(x>>1,y>>1)]){warmV[o]=0.05;coolV[o]=0.06;}
    else coolV[o]=0.30;
  }
  const all=lights.concat(moonLights);
  for(const li of all){
    if(!li.on)continue;
    const R=Math.ceil(li.r), cool=li.type==='moon';
    for(let y=li.y-R;y<=li.y+R;y++)for(let x=li.x-R;x<=li.x+R;x++){
      if(x<0||y<0||x>=MW||y>=MH)continue;
      const d=Math.hypot(x-li.x,y-li.y);
      if(d>li.r||!losTile(li.x,li.y,x,y))continue;
      lightG[idx(x,y)]=Math.min(1,lightG[idx(x,y)]+Math.pow(1-d/li.r,1.4)*(cool?0.8:1));
    }
    const arr=cool?coolV:warmV;
    for(let sy=(li.y-R)*LR;sy<=(li.y+R+1)*LR;sy++)for(let sx=(li.x-R)*LR;sx<=(li.x+R+1)*LR;sx++){
      if(sx<0||sy<0||sx>=VW||sy>=VH)continue;
      const d=Math.hypot((sx+0.5)/LR-(li.x+0.5),(sy+0.5)/LR-(li.y+0.5));
      if(d>li.r||!losTile(li.x,li.y,sx>>1,sy>>1))continue;
      const o=sy*VW+sx;
      arr[o]=Math.min(1.1,arr[o]+Math.pow(1-d/li.r,1.4)*(cool?0.8:1));
    }
  }
  if(glReady)uploadLightTex();
}
function lightAtPx(px,py){
  const x=Math.floor(px/TILE),y=Math.floor(py/TILE);
  return (x<0||y<0||x>=MW||y>=MH)?0:lightG[idx(x,y)];
}
const APPEAR_BARKS=['Bu ışık da nereden çıktı?','Kim yaktı bunu?','Az önce karanlıktı orası...'];
function notifyLightChange(tx,ty,appeared){
  for(const g of guards){
    if(g.state!=='patrol'&&g.state!=='search')continue;
    if(Math.hypot(g.x-(tx*TILE+8),g.y-(ty*TILE+8))>115)continue;
    if(!losTile(Math.floor(g.x/TILE),Math.floor(g.y/TILE),tx,ty))continue;
    g.bark=appeared?APPEAR_BARKS[(Math.random()*APPEAR_BARKS.length)|0]
                   :BARKS.douse[(Math.random()*BARKS.douse.length)|0];
    g.barkT=2.6; hearNoise(g,tx*TILE+8,ty*TILE+8);
  }
}

// ---------------- Yol bulma ----------------
function findPath(sx,sy,tx,ty){
  sx=Math.floor(sx/TILE);sy=Math.floor(sy/TILE);tx=Math.floor(tx/TILE);ty=Math.floor(ty/TILE);
  if(sx===tx&&sy===ty)return [];
  const prev=new Int32Array(MW*MH).fill(-1), q=[idx(sx,sy)];
  prev[idx(sx,sy)]=idx(sx,sy);
  while(q.length){
    const cur=q.shift(), cx=cur%MW, cy=(cur-cx)/MW;
    for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+ox,ny=cy+oy;
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const ni=idx(nx,ny);
      if(solidG[ni]||prev[ni]!==-1)continue;
      prev[ni]=cur;
      if(nx===tx&&ny===ty){
        const path=[];let c=ni;
        while(c!==idx(sx,sy)){const x=c%MW,y=(c-x)/MW;path.push([x*TILE+8,y*TILE+8]);c=prev[c];}
        path.reverse();return path;
      }
      q.push(ni);
    }
  }
  return null;
}

// ---------------- Ses: konumsal SFX + ambiyans motoru ----------------
// docs/04 §6: "Bu oyun kulakla oynanır." Rüzgâr, cırcır, ocak çıtırtısı,
// uzak liman çanı, Nihavend dronu + gerilim katmanı; devriye adımları ve
// asa tak-tak telegrafı stereo-pan ile konumlandırılır.
let AC=null, master=null, muted=false, noiseBuf=null, amb=null;
function audioInit(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
    const len=2*AC.sampleRate;
    noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const nd=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++)nd[i]=Math.random()*2-1;
    amb={out:0,bellT:10+Math.random()*10,owlT:16+Math.random()*12,chirpT:1.5,ckT:0.1};
    const mkLoop=(type,fq,q,g0)=>{
      const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
      const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fq;f.Q.value=q||1;
      const g=AC.createGain();g.gain.value=g0||0;
      s.connect(f);f.connect(g);g.connect(master);s.start();return g;
    };
    amb.wind=mkLoop('bandpass',430,0.6,0);
    amb.hum=mkLoop('lowpass',190,1,0.013); // taban gece uğultusu
    // Nihavend dronu (re ekseni: D2 + beşli + oktav)
    const dr=AC.createGain();dr.gain.value=0;
    const dlp=AC.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=240;
    dlp.connect(dr);dr.connect(master);
    [[73.42,'sawtooth',1],[73.95,'sawtooth',0.7],[110.0,'sine',0.8],[146.83,'sine',0.25]].forEach(([f,tp,v])=>{
      const o=AC.createOscillator();o.type=tp;o.frequency.value=f;
      const g=AC.createGain();g.gain.value=v*0.33;o.connect(g);g.connect(dlp);o.start();
    });
    amb.drone=dr;
    // gerilim katmanı: küçük ikili (mi bemol) + tremolo — şüphe/alarmda açılır
    const tg=AC.createGain();tg.gain.value=0;
    const tlp=AC.createBiquadFilter();tlp.type='lowpass';tlp.frequency.value=560;
    tlp.connect(tg);tg.connect(master);
    [[77.78,'sawtooth'],[155.56,'sawtooth']].forEach(([f,tp])=>{
      const o=AC.createOscillator();o.type=tp;o.frequency.value=f;
      const g=AC.createGain();g.gain.value=0.5;o.connect(g);g.connect(tlp);o.start();
    });
    const lfo=AC.createOscillator();lfo.frequency.value=5.2;
    const lg=AC.createGain();lg.gain.value=180;
    lfo.connect(lg);lg.connect(tlp.frequency);lfo.start();
    amb.tense=tg;
  }catch(e){}
}
function spat(x,y,maxD){ // kaynak konumu → {pan, hacim}; duvar arkası boğuklaşır
  const dx=x-player.x,dy=y-player.y,d=Math.hypot(dx,dy);
  if(d>maxD)return null;
  const rel=Math.atan2(dy,dx)-player.ang;
  const los=losTile(Math.floor(player.x/TILE),Math.floor(player.y/TILE),
                    Math.max(0,Math.min(MW-1,Math.floor(x/TILE))),Math.max(0,Math.min(MH-1,Math.floor(y/TILE))));
  return {pan:Math.sin(rel)*Math.min(1,d/60),vol:Math.pow(Math.max(0,1-d/maxD),1.5)*(los?1:0.4)};
}
function chan(vol,pos){
  if(!AC||muted)return null;
  const g=AC.createGain();let v=vol;
  if(pos){
    const sp=spat(pos.x,pos.y,pos.d||10*TILE);
    if(!sp||sp.vol*vol<0.002)return null;
    v*=sp.vol;
    if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=sp.pan;g.connect(p);p.connect(master);}
    else g.connect(master);
  }else g.connect(master);
  return {g,v};
}
function tone(fr,dur,type,vol,slide,pos){
  const c=chan(vol,pos);if(!c)return;
  const o=AC.createOscillator(),t=AC.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(fr,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  c.g.gain.setValueAtTime(c.v,t);c.g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(c.g);o.start(t);o.stop(t+dur+0.02);
}
function noiseSfx(dur,vol,freq,pos,hp){
  const c=chan(vol,pos);if(!c)return;
  const len=Math.max(1,Math.floor(dur*AC.sampleRate)),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=freq||700;
  c.g.gain.value=c.v;
  s.connect(f);f.connect(c.g);s.start();
}
const SFX={
  step:(v,fl)=>{ // oyuncu adımı: zemine göre karakter
    const V=Math.min(0.25,0.05+v*0.0023);
    if(fl==='w'){tone(102,0.06,'sine',V*0.85,64);noiseSfx(0.05,V*0.4,620);
      if(Math.random()<0.30)tone(215+Math.random()*70,0.16,'sawtooth',V*0.28,130);} // gıcırtı
    else if(fl==='s'){noiseSfx(0.03,V*0.7,2200,null,true);tone(170,0.035,'triangle',V*0.5,110);}
    else if(fl==='c'){noiseSfx(0.06,V*0.5,280);}
    else{noiseSfx(0.07,V*0.55,1200,null,true);noiseSfx(0.05,V*0.3,500);}
  },
  gstep:(g,fl,run)=>{ // devriye adımı (konumsal — görmeden duyarsın)
    const pos={x:g.x,y:g.y,d:9*TILE},V=run?0.17:0.10;
    if(fl==='w')tone(96,0.05,'sine',V,66,pos);
    else if(fl==='c')noiseSfx(0.05,V*0.7,300,pos);
    else noiseSfx(0.035,V,fl==='s'?2000:1100,pos,fl==='s');
  },
  tak:g=>{ // asa tak-tak: devriye habercisi (docs/04)
    const pos={x:g.x,y:g.y,d:13*TILE};
    tone(1250,0.028,'square',0.10,850,pos);tone(620,0.05,'sine',0.055,360,pos);
  },
  loot:()=>{tone(660,0.09,'sine',0.16);setTimeout(()=>tone(990,0.13,'sine',0.14),70);},

function updateAudio(dt){
  if(!AC||!amb)return;
  const T=AC.currentTime, set=(g,v,tc)=>g.gain.setTargetAtTime(v,T,tc||0.35);
  const ind=indoorG[idx(Math.floor(player.x/TILE),Math.floor(player.y/TILE))]?1:0;
  amb.out+=((1-ind)-amb.out)*Math.min(1,dt*2.5);
  set(amb.wind,0.005+0.016*amb.out);
  set(amb.drone,0.012,1.2);
  const alertN=guards.some(g=>g.state==='alert'), susN=guards.some(g=>g.state==='suspect'||g.state==='search');
  set(amb.tense,alertN?0.034:susN?0.011:0,alertN?0.12:0.8);
  // en yakın alevden ocak çıtırtısı (rastgele kısa patlamalar)
  let bd=1e9,bl=null;
  for(const li of lights)if(li.on){const d=Math.hypot(li.x*TILE+8-player.x,li.y*TILE+8-player.y);if(d<bd){bd=d;bl=li;}}
  amb.ckT-=dt;
  if(bl&&bd<5.5*TILE&&amb.ckT<=0){
    amb.ckT=0.04+Math.random()*0.22;
    if(Math.random()<0.75)noiseSfx(0.02+Math.random()*0.03,(0.05+Math.random()*0.10)*Math.pow(1-bd/(5.5*TILE),1.6),2600,{x:bl.x*TILE+8,y:bl.y*TILE+8,d:6*TILE},true);
  }
  // cırcır böcekleri (açık havada belirgin)
  amb.chirpT-=dt;
  if(amb.chirpT<=0){
    amb.chirpT=0.5+Math.random()*2.2;
    const v=0.005+0.028*amb.out;
    if(v>0.008)for(let i=0;i<3;i++)setTimeout(()=>tone(4100+Math.random()*350,0.022,'square',v),i*62);
  }
  // uzak liman çanı (kuzeybatıdan)
  amb.bellT-=dt;
  if(amb.bellT<=0){
    amb.bellT=36+Math.random()*36;
    const pos={x:-1400,y:-700,d:1e9};
    tone(146.8,2.6,'sine',0.045,null,pos);tone(293.7,1.7,'sine',0.018,null,pos);tone(352,1.1,'sine',0.010,null,pos);
  }
  // baykuş
  amb.owlT-=dt;
  if(amb.owlT<=0){
    amb.owlT=24+Math.random()*32;
    if(amb.out>0.4){
      const pos={x:player.x+(Math.random()-0.5)*900,y:player.y-500,d:1e9};
      tone(392,0.22,'sine',0.035,330,pos);
      setTimeout(()=>tone(360,0.34,'sine',0.030,300,pos),350);

  }
}

const BARKS={
  suspect:['Hı? Kim var orada?','Bir şey kımıldadı...','Şu sese bir bakayım.','Gölgemi gördüm sandım...'],
  alert:['HIRSIZ! Yakalayın!','Orada! Gördüm seni!','Dur! Kaçma bre!','Ases çağırın!'],
  search:['Nereye kayboldu bu?','Buralarda bir yerde...','Çık ortaya, sıçan!'],
  giveup:['Rüzgârdır... rüzgâr olsun.','Kedidir kedi.','Kafayı yiyeceğim bu gece.'],
  body:['Aman Bânî! Adam yatıyor!','Cinayet var! Silah başına!'],
  douse:['Fener mi söndü şimdi?','Kim karıştı ışığa?'],
  idle:['Çorbam soğudu, mum bitti...','Böcekbaşı duymasın, uyuyakalmışım.','Bu konakta hayalet var diyorlar.','Ah şu gece devriyeleri...','Maaş üç aydır gecikti zaten.']
};
function say(g,type){g.bark=BARKS[type][Math.floor(Math.random()*BARKS[type].length)];g.barkT=2.6;}
function setState(g,s){
  const was=g.state;g.state=s;
  if(s==='suspect'&&was!=='suspect'){say(g,'suspect');SFX.suspect();}
  if(s==='alert'&&was!=='alert'){say(g,'alert');SFX.alert();player.seen++;tension=true;}
  if(s==='search')say(g,'search');
}
function hearNoise(g,x,y){
  g.target=[x,y];g.path=findPath(g.x,g.y,x,y);g.pi=0;g.stuckT=0;
  if(g.state!=='suspect'){setState(g,'suspect');g.meter=Math.max(g.meter,0.45);}
}
function emitNoise(x,y,r){
  const sx=Math.floor(x/TILE),sy=Math.floor(y/TILE);
  for(const g of guards){
    if(g.state==='alert')continue;
    let eff=r;
    if(!losTile(sx,sy,Math.floor(g.x/TILE),Math.floor(g.y/TILE)))eff=r*0.5;
    if(Math.hypot(g.x-x,g.y-y)<=eff)hearNoise(g,x,y);
  }
}
function guardVision(g,tx,ty,crouched){
  const d=Math.hypot(tx-g.x,ty-g.y);
  const L=lightAtPx(tx,ty);
  let R=110*(0.2+0.8*L)*(crouched?0.72:1)*g.boost;
  if(g.state==='alert')R*=1.3;
  if(d>R)return 0;
  const fx=Math.cos(g.dir),fy=Math.sin(g.dir),vx=(tx-g.x)/(d||1),vy=(ty-g.y)/(d||1);
  if(fx*vx+fy*vy<Math.cos(0.75))return 0;
  if(!losTile(Math.floor(g.x/TILE),Math.floor(g.y/TILE),Math.floor(tx/TILE),Math.floor(ty/TILE)))return 0;
  return 1-d/R;
}
function moveAlong(g,speed,dt){
  g.moving=false;
  if(!g.path||g.pi>=g.path.length)return true;
  const [tx,ty]=g.path[g.pi];
  const dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy);
  if(d<3){g.pi++;return g.pi>=g.path.length;}
  g.dir=Math.atan2(dy,dx);g.moving=true;
  g.x+=dx/d*speed*dt;g.y+=dy/d*speed*dt;g.bob+=speed*dt*0.09;
  g.stepA+=speed*dt;
  if(g.stepA>=14){
    g.stepA=0;
    const fl=floorG[idx(Math.floor(g.x/TILE),Math.floor(g.y/TILE))];
    SFX.gstep(g,fl,speed>55);
    g.tapN++;
    if(g.state==='patrol'&&g.tapN%2===0)SFX.tak(g);
  }
  for(const dr of doors)if(!dr.open){
    if(Math.hypot(dr.x*TILE+8-g.x,dr.y*TILE+8-g.y)<14){dr.open=true;computeLight();SFX.door(dr.x*TILE+8,dr.y*TILE+8);}
  }
  return false;
}
function updateGuard(g,dt){
  const vis=guardVision(g,player.x,player.y,player.crouch);
  g.visNow=vis;
  if(vis>0){
    const rate=(0.55+vis*1.15)*(player.moving?1.45:0.85)*(g.state==='suspect'?1.7:1);
    g.meter=Math.min(1.2,g.meter+rate*dt);
    if(g.state==='alert'){g.loseT=0;g.lastSeen=[player.x,player.y];}
  }else g.meter=Math.max(0,g.meter-0.55*dt);
  if(g.meter>=1&&g.state!=='alert'){
    setState(g,'alert');g.lastSeen=[player.x,player.y];g.repathT=0;g.loseT=0;
  }else if(g.meter>=0.35&&g.state==='patrol'){
    g.target=[player.x,player.y];g.path=findPath(g.x,g.y,player.x,player.y);g.pi=0;
    setState(g,'suspect');g.scanT=0;
  }
  for(const b of bodies)if(!b.found&&guardVision(g,b.x,b.y,true)>0.15){
    b.found=true;say(g,'body');SFX.alert();g.boost=1.25;tension=true;
    g.target=[b.x,b.y];g.path=findPath(g.x,g.y,b.x,b.y);g.pi=0;setState(g,'suspect');g.meter=0.6;
  }
  if(g.state==='patrol'){
    g.idleT-=dt;
    if(g.idleT<0){g.idleT=7+Math.random()*9;if(Math.random()<0.6)say(g,'idle');}
    if(g.static){
      const d=Math.hypot(g.post[0]-g.x,g.post[1]-g.y);
      if(d>4){if(!g.path||g.pi>=g.path.length){g.path=findPath(g.x,g.y,g.post[0],g.post[1]);g.pi=0;}moveAlong(g,30,dt);}
      else {
        g.dir=g.scanBase+Math.sin(timeInMission*0.7+g.bob)*0.65;g.moving=false;
        g.tapT-=dt;
        if(g.tapT<=0){SFX.tak(g);g.tapT=2.5+Math.random()*4;} // nöbetçi asasını yere vurur
      }
    }else{
      const wp=g.wps[g.wpi],tx=wp[0]*TILE+8,ty=wp[1]*TILE+8;
      if(!g.path||g.pi>=g.path.length){
        if(Math.hypot(tx-g.x,ty-g.y)<4){g.wpi=(g.wpi+1)%g.wps.length;const w2=g.wps[g.wpi];g.path=findPath(g.x,g.y,w2[0]*TILE+8,w2[1]*TILE+8);}
        else g.path=findPath(g.x,g.y,tx,ty);
        g.pi=0;
      }
      moveAlong(g,30*(tension?1.15:1),dt);
    }
  }
  else if(g.state==='suspect'){
    if(g.path&&g.pi<g.path.length){
      g.stuckT+=dt;
      if(moveAlong(g,42,dt)||g.stuckT>6)g.scanT=1.8;
    }else if(g.scanT>0){
      g.scanT-=dt;g.dir+=Math.sin(timeInMission*3.1)*0.09;g.moving=false;
      if(g.scanT<=0){
        if(g.meter<0.3){say(g,'giveup');SFX.giveup();g.state='patrol';g.path=null;g.stuckT=0;}
        else g.scanT=1.2;
      }
    }else g.scanT=1.8;
  }
  else if(g.state==='alert'){
    g.repathT-=dt;
    if(g.repathT<=0){g.path=findPath(g.x,g.y,player.x,player.y);g.pi=0;g.repathT=0.5;}
    moveAlong(g,62,dt);
    if(vis<=0){g.loseT+=dt;if(g.loseT>2.6){setState(g,'search');g.searchN=0;g.path=findPath(g.x,g.y,g.lastSeen[0],g.lastSeen[1]);g.pi=0;g.meter=0.8;}}
    if(Math.hypot(g.x-player.x,g.y-player.y)<11){state='caught';SFX.lose();}
  }
  else if(g.state==='search'){
    if(!g.path||g.pi>=g.path.length){
      if(g.scanT>0){g.scanT-=dt;g.dir+=0.05;g.moving=false;}
      else if(g.searchN<3){
        g.searchN++;g.scanT=1.1;
        const a=Math.random()*Math.PI*2,r=30+Math.random()*40;
        const nx=g.lastSeen[0]+Math.cos(a)*r,ny=g.lastSeen[1]+Math.sin(a)*r;
        const tX=Math.max(1,Math.min(MW-2,Math.floor(nx/TILE))),tY=Math.max(1,Math.min(MH-2,Math.floor(ny/TILE)));
        if(!solidG[idx(tX,tY)]){g.path=findPath(g.x,g.y,tX*TILE+8,tY*TILE+8);g.pi=0;}
      }else{
        say(g,'giveup');SFX.giveup();g.boost=Math.max(g.boost,1.15);
        g.state='patrol';g.path=null;g.meter=0;
      }
    }else moveAlong(g,46,dt);
    if(vis>0.4){setState(g,'alert');g.lastSeen=[player.x,player.y];}
  }
  if(g.barkT>0)g.barkT-=dt;
}

const keys={};

addEventListener('keydown',e=>{
  audioInit();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','KeyE'].includes(e.code))e.preventDefault();
  if(keys[e.code])return; keys[e.code]=true;
  if(e.code==='KeyM'){muted=!muted;if(master)master.gain.value=muted?0:0.5;toast(muted?'Ses kapalı':'Ses açık','#9fb0c8');}
  if(e.code==='Digit1')setBright(-0.1);
  if(e.code==='Digit2')setBright(0.1);
  if(state==='title'&&e.code==='Enter'){buildWorld();state='play';}
  else if(state==='play'){
    if(e.code==='KeyC')player.crouch=!player.crouch;
    if(e.code==='KeyE')startInteract();
    if(e.code==='Space')tryKO();
    if(e.code==='KeyQ')throwPebble();
    if(e.code==='KeyR'){buildWorld();state='play';}
  }
  else if(state==='caught'||state==='win'){
    if(e.code==='KeyR'){buildWorld();state='play';}
    if(e.code==='Enter')state='title';
  }
});
addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='KeyE'&&player)player.channel=null;
});

// ---------------- Oyuncu eylemleri (Fanus dahil) ----------------
function toast(text,col){toasts.unshift({text,col:col||'#e9e2d0',t:2.8});if(toasts.length>4)toasts.pop();}
function lookVec(){return [Math.cos(player.ang),Math.sin(player.ang)];}
function findTarget(){
  const [lx,ly]=lookVec(); let best=null,bs=-2;
  const cand=[];
  for(const l of loots)if(!l.taken)cand.push({k:'loot',o:l,x:l.x*TILE+8,y:l.y*TILE+8,rng:24});
  for(const d of doors)cand.push({k:'door',o:d,x:d.x*TILE+8,y:d.y*TILE+8,rng:28});
  for(const li of lights)if(li.on)cand.push({k:'light',o:li,x:li.x*TILE+8,y:li.y*TILE+8,rng:26});
  for(const c of cand){
    const dx=c.x-player.x,dy=c.y-player.y,d=Math.hypot(dx,dy);
    if(d>c.rng)continue;
    const dot=(dx*lx+dy*ly)/(d||1);
    if(dot<0.45)continue;
    if(!losTile(Math.floor(player.x/TILE),Math.floor(player.y/TILE),Math.floor(c.x/TILE),Math.floor(c.y/TILE))
       && c.k!=='door')continue;
    if(dot>bs){bs=dot;best=c;c.d=d;}
  }
  return best;
}
function startInteract(){
  const t=findTarget();
  if(!t)return;
  if(t.k==='loot'){
    t.o.taken=true;player.loot+=t.o.val;
    toast((t.o.big?'✦ ':'')+t.o.name+'  +'+t.o.val+' akçe','#ffd76a');
    t.o.big?SFX.big():SFX.loot();
    if(player.loot>=GOAL&&player.loot-t.o.val<GOAL)toast('Kese doldu! Kuzey bahçe kapısına...','#9fe3a1');
  }else if(t.k==='door'){
    t.o.open=!t.o.open;computeLight();SFX.door();
    emitNoise(t.o.x*TILE+8,t.o.y*TILE+8,26);
  }else if(t.k==='light'){
    if(player.flames>=2){toast('Fanus dolu — önce bir alevi bırak (SOL TIK)','#d98a76');return;}
    player.channel={o:t.o,t:0};
  }
}
function updateChannel(dt){
  const ch=player.channel;
  if(!ch)return;
  const o=ch.o;
  const d=Math.hypot(o.x*TILE+8-player.x,o.y*TILE+8-player.y);
  if(!keys.KeyE||!o.on||d>30||player.moving){player.channel=null;return;}
  ch.t+=dt;
  if(ch.t>=1.0){
    player.channel=null;player.flames++;
    if(o.type==='placed')lights.splice(lights.indexOf(o),1); else o.on=false;
    computeLight();SFX.steal();
    toast('Alev fanusta ('+player.flames+'/2)','#ffcf7a');
    notifyLightChange(o.x,o.y,false);
  }
}
function throwFlame(){
  if(player.flames<=0){toast('Fanus boş — bir alevin başında E\'ye basılı tut','#d98a76');return;}
  const [lx,ly]=lookVec();
  projs.push({x:player.x,y:player.y,dx:lx,dy:ly,left:8*TILE,kind:'flame',sp:190});
  player.flames--;SFX.throw();
}
function throwPebble(){
  if(player.pebble<=0){toast('Çakıl kalmadı','#d98a76');return;}
  const [lx,ly]=lookVec();
  projs.push({x:player.x,y:player.y,dx:lx,dy:ly,left:9*TILE,kind:'pebble',sp:230});
  player.pebble--;SFX.throw();
}
function tryKO(){
  for(let i=0;i<guards.length;i++){
    const g=guards[i],d=Math.hypot(g.x-player.x,g.y-player.y);
    if(d>19)continue;
    const fx=Math.cos(g.dir),fy=Math.sin(g.dir);
    const tx=(player.x-g.x)/d,ty=(player.y-g.y)/d;
    if(g.state!=='alert'&&(fx*tx+fy*ty)<-0.2){
      bodies.push({x:g.x,y:g.y,dir:g.dir,found:false});
      guards.splice(i,1);player.ko++;SFX.ko();
      emitNoise(g.x,g.y,28);
      toast('Ases bayıltıldı','#9fb0c8');
      return;
    }else{setState(g,'alert');g.meter=1;return;}
  }
}
function circleFree(px,py,r){
  for(const [ox,oy] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,-r],[0,r],[-r,0],[r,0]]){
    const tx=Math.floor((px+ox)/TILE),ty=Math.floor((py+oy)/TILE);
    if(tx<0||ty<0||tx>=MW||ty>=MH)return false;
    if(solidG[idx(tx,ty)])return false;
    const d=doorAt(tx,ty);if(d&&!d.open)return false;
  }
  return true;
}
const FLOOR_NOISE={g:{c:4,w:9,r:24},c:{c:5,w:11,r:28},s:{c:9,w:20,r:56},w:{c:20,w:38,r:84}};
function updatePlayer(dt){
  let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp)f+=1;
  if(keys.KeyS||keys.ArrowDown)f-=1;
  if(keys.KeyA)s-=1;
  if(keys.KeyD)s+=1;
  if(keys.ArrowLeft)player.ang-=2.4*dt;
  if(keys.ArrowRight)player.ang+=2.4*dt;
  const run=(keys.ShiftLeft||keys.ShiftRight)&&!player.crouch;
  const sp=player.crouch?27:run?80:47;
  player.moving=false;
  if(f||s){
    const [lx,ly]=lookVec();
    let dx=lx*f+(-ly)*s, dy=ly*f+lx*s;
    const m=Math.hypot(dx,dy);dx/=m;dy/=m;
    player.moving=true;player.bobT+=dt*(run?12:7.5);
    const nx=player.x+dx*sp*dt,ny=player.y+dy*sp*dt;
    if(circleFree(nx,player.y,4))player.x=nx;
    if(circleFree(player.x,ny,4))player.y=ny;
    player.stepAcc+=sp*dt;
    const need=player.crouch?15:run?10:13;
    if(player.stepAcc>=need){
      player.stepAcc=0;
      const fl=floorG[idx(Math.floor(player.x/TILE),Math.floor(player.y/TILE))];
      const nr=FLOOR_NOISE[fl][player.crouch?'c':run?'r':'w'];
      emitNoise(player.x,player.y,nr);
      SFX.step(nr,fl);
    }
  }
  const tx=Math.floor(player.x/TILE),ty=Math.floor(player.y/TILE);
  if(player.loot>=GOAL&&tx>=38&&tx<=40&&ty>=1&&ty<=2){state='win';SFX.win();}
}
function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i],adv=Math.min(p.sp*dt,p.left);
    const nx=p.x+p.dx*adv,ny=p.y+p.dy*adv;
    const tX=Math.floor(nx/TILE),tY=Math.floor(ny/TILE);
    const dr=doorAt(tX,tY);
    const hitWall=solidG[idx(tX,tY)]||(dr&&!dr.open);
    if(hitWall||((p.left-=adv)<=0.5)){
      const lx=hitWall?p.x:nx,ly=hitWall?p.y:ny;
      if(p.kind==='pebble'){SFX.pebble({x:lx,y:ly});emitNoise(lx,ly,85);}
      else{
        const fx=Math.floor(lx/TILE),fy=Math.floor(ly/TILE);
        lights.push({x:fx,y:fy,type:'placed',r:4,base:0,on:true,fl:Math.random()*7});
        computeLight();SFX.place({x:lx,y:ly});
        emitNoise(lx,ly,20);
        notifyLightChange(fx,fy,true);
      }
      projs.splice(i,1);
    }else{p.x=nx;p.y=ny;}
  }
  for(let i=toasts.length-1;i>=0;i--){toasts[i].t-=dt;if(toasts[i].t<=0)toasts.splice(i,1);}
  for(const d of doors)d.animT+=( (d.open?1:0)-d.animT )*Math.min(1,dt*5);
}

// ---- mat4 yardımcıları (sütun-major) ----
function mIdent(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;}
function mMul(a,b){
  const o=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++)
    o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  return o;
}
function mPersp(fovY,asp,n,f){
  const m=new Float32Array(16),t=1/Math.tan(fovY/2);
  m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);
  return m;
}
function mTrans(x,y,z){const m=mIdent();m[12]=x;m[13]=y;m[14]=z;return m;}
function mScale(x,y,z){const m=mIdent();m[0]=x;m[5]=y;m[10]=z;return m;}
function mRotY(a){const m=mIdent(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;}
function mRotX(a){const m=mIdent(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;}
function mRotZ(a){const m=mIdent(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;}
function mLookAt(ex,ey,ez,tx,ty,tz){
  let zx=ex-tx,zy=ey-ty,zz=ez-tz;                 // z: bakışın tersi
  const zl=Math.hypot(zx,zy,zz)||1;zx/=zl;zy/=zl;zz/=zl;
  let xx=zz,xy=0,xz=-zx;                           // x = up × z, up=(0,1,0)
  const xl=Math.hypot(xx,xy,xz)||1;xx/=xl;xz/=xl;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx; // y = z × x
  const m=new Float32Array(16);
  m[0]=xx;m[4]=xy;m[8]=xz; m[12]=-(xx*ex+xy*ey+xz*ez);
  m[1]=yx;m[5]=yy;m[9]=yz; m[13]=-(yx*ex+yy*ey+yz*ez);
  m[2]=zx;m[6]=zy;m[10]=zz;m[14]=-(zx*ex+zy*ey+zz*ez);
  m[15]=1;
  return m;
}
const mm=(...ms)=>ms.reduce(mMul); // zincirleme çarpım (soldan sağa uygulanır)

function hashN(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;}
function uv(i){ // atlas hücresi → [u0,v0,u1,v1] (kanama önleyici iç pay)
  const cx=(i%AT_COLS)*CELL,cy=((i/AT_COLS)|0)*CELL,p=0.6;
  return [(cx+p)/AT_W,(cy+p)/AT_H,(cx+CELL-p)/AT_W,(cy+CELL-p)/AT_H];
}

// ---- shader ----
const VS=`
attribute vec3 aPos; attribute vec2 aUV; attribute float aShade;
uniform mat4 uVP, uModel;
varying vec2 vUV; varying float vShade; varying vec3 vWorld;
void main(){
  vec4 w=uModel*vec4(aPos,1.0);
  vWorld=w.xyz; vUV=aUV; vShade=aShade;
  gl_Position=uVP*w;
}`;
const FS=`
precision mediump float;
varying vec2 vUV; varying float vShade; varying vec3 vWorld;
uniform sampler2D uTex, uLight;
uniform vec3 uCam; uniform vec4 uTint; uniform float uEmissive, uBright, uFlick;
void main(){
  vec4 t=texture2D(uTex,vUV)*uTint;
  if(t.a<0.06)discard;
  // r = sıcak (kandil, titrer), g = soğuk (ay, sabit)
  vec2 lrg=texture2D(uLight,vec2(vWorld.x/46.0,vWorld.z/30.0)).rg;
  float Lw=lrg.r*uFlick, Lc=lrg.g, L=Lw+Lc;
  // görsel taban aydınlık yüksek tutulur; oyun kuralı (devriye görüşü) lightG'yi ayrı kullanır
  float br=mix(clamp(0.33+0.87*L,0.0,1.25),1.0,uEmissive)*uBright;
  br=floor(br*12.0+0.5)/12.0;
  vec3 warm=vec3(1.14,0.98,0.76), cool=vec3(0.64,0.77,1.12);
  vec3 tint=(warm*Lw+cool*Lc+vec3(0.74,0.82,1.06)*0.05)/(L+0.05);
  vec3 col=t.rgb*br*vShade*mix(tint,vec3(1.0),uEmissive);
  float d=distance(vWorld.xz,uCam.xz);
  float fog=clamp(1.0-d/44.0,0.32,1.0);
  fog=mix(fog,1.0,uEmissive); // ışık saçanlar sise batmaz
  col=mix(vec3(0.04,0.05,0.10),col,fog);
  gl_FragColor=vec4(col,t.a);
}`;
function glInit(){
  if(!gl)return false;
  const sh=(type,src)=>{
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  for(const n of ['uVP','uModel','uCam','uTint','uEmissive','uBright','uFlick','uTex','uLight'])U[n]=gl.getUniformLocation(prog,n);
  for(const n of ['aPos','aUV','aShade'])A[n]=gl.getAttribLocation(prog,n);
  // atlas
  atlasTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,atlasTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,makeAtlas());
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  // ışık dokusu (RGB: r sıcak, g soğuk; 2× çözünürlük)
  gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  lightTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,lightTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,VW,VH,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array(VW*VH*3));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  meshCube=buildCube();
  meshQuad=buildQuad();
  meshOcta=buildOcta();
  meshDoor=buildCellCube(TI.door);
  meshWaterA=buildWaterQuad(TI.waterA);
  meshWaterB=buildWaterQuad(TI.waterB);
  buildGuardParts();
  glReady=true;
  return true;
}
function uploadLightTex(){
  const d=new Uint8Array(VW*VH*3);
  for(let i=0;i<VW*VH;i++){
    d[i*3]=Math.min(255,warmV[i]*255)|0;
    d[i*3+1]=Math.min(255,coolV[i]*255)|0;
  }
  gl.bindTexture(gl.TEXTURE_2D,lightTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,VW,VH,0,gl.RGB,gl.UNSIGNED_BYTE,d);
}
function buildVBO(arr){
  const b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);
  return {buf:b,n:arr.length/6};
}
// quad ekleme yardımcıları: p1..p4 saat yönü tersi, uv hücresi, gölgelendirme
function pushQuad(a,p1,p2,p3,p4,cellUV,shade,uvRot){
  const [u0,v0,u1,v1]=cellUV;
  const c=[[u0,v1],[u1,v1],[u1,v0],[u0,v0]];
  const pts=[p1,p2,p3,p4];
  const tri=[0,1,2,0,2,3];
  for(const i of tri)a.push(pts[i][0],pts[i][1],pts[i][2],c[i][0],c[i][1],shade);

function faceCells(C){
  if(typeof C==='number')return{f:C,b:C,l:C,r:C,t:C,bo:C};
  const s=C.s??C.f;
  return {f:C.f??s,b:C.b??s,l:C.l??s,r:C.r??s,t:C.t??s,bo:C.bo??s};
}
function fbox(a,x0,x1,y0,y1,z0,z1,C,shm){
  const c=faceCells(C),m=shm||1;
  pushQuad(a,[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],uv(c.f),0.95*m);
  pushQuad(a,[x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],uv(c.b),0.72*m);
  pushQuad(a,[x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],uv(c.l),0.66*m);
  pushQuad(a,[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],uv(c.r),0.84*m);
  pushQuad(a,[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],uv(c.t),1.02*m);
  pushQuad(a,[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],uv(c.bo),0.45*m);

function fprism(a,cx,cz,bw,bd,tw,td,y0,y1,C,shm){ // incelen prizma (frustum)

  pushQuad(a,[cx-bw,y0,cz-bd],[cx+bw,y0,cz-bd],[cx+tw,y1,cz-td],[cx-tw,y1,cz-td],uv(c.f),0.95*m);
  pushQuad(a,[cx+bw,y0,cz+bd],[cx-bw,y0,cz+bd],[cx-tw,y1,cz+td],[cx+tw,y1,cz+td],uv(c.b),0.72*m);

  pushQuad(a,[cx+bw,y0,cz-bd],[cx+bw,y0,cz+bd],[cx+tw,y1,cz+td],[cx+tw,y1,cz-td],uv(c.r),0.84*m);
  pushQuad(a,[cx-tw,y1,cz+td],[cx+tw,y1,cz+td],[cx+tw,y1,cz-td],[cx-tw,y1,cz-td],uv(c.t),1.02*m);
  pushQuad(a,[cx-bw,y0,cz-bd],[cx+bw,y0,cz-bd],[cx+bw,y0,cz+bd],[cx-bw,y0,cz+bd],uv(c.bo),0.45*m);

function buildStaticMesh(){

  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=solidG[idx(x,y)];
    if(s===1||s===2){ // duvar yüzleri (komşusu geçilir olanlar)
      const edge=(x===0||y===0||x===MW-1||y===MH-1);
      const H=edge?2.0:WALL_H;

        if(isGate)return uv(TI.gate);
        if(s===2)return uv(TI.pillar);
        if(isWin)return uv(TI.window);
        if(indoorG[idx(ex,ey)]&&!edge){ // iç yüz: odaya göre sıva/çini/moloz
          const f=floorG[idx(ex,ey)];
          return uv(f==='w'?TI.rough:f==='c'?TI.plaster:f==='s'?TI.plasterBand:TI.stone);
        }

      };

      if(y<MH-1&&open(solidG[idx(x,y+1)]))pushQuad(a,[x+1,0,y+1],[x,0,y+1],[x,H,y+1],[x+1,H,y+1],ftex(x,y+1),0.98);
      if(x>0&&open(solidG[idx(x-1,y)]))pushQuad(a,[x,0,y+1],[x,0,y],[x,H,y],[x,H,y+1],ftex(x-1,y),0.74);
      if(x<MW-1&&open(solidG[idx(x+1,y)]))pushQuad(a,[x+1,0,y],[x+1,0,y+1],[x+1,H,y+1],[x+1,H,y],ftex(x+1,y),0.80);
      if(edge&&!isGate&&((x+y)%2===0))fbox(a,x+0.22,x+0.78,H,H+0.28,y+0.22,y+0.78,TI.stone,0.9); // sur mazgalı
      continue;
    }
    // zemin (mobilya/ağaç/şadırvan hücreleri de zeminlerini çizer)
    const f=floorG[idx(x,y)];
    const fm=f==='c'?uv(TI.carpet):f==='w'?uv(TI.wood):f==='g'?uv(hashN(x,y)>0.82?TI.grass2:TI.grass):uv(TI.fstone);
    pushQuad(a,[x,0,y+1],[x+1,0,y+1],[x+1,0,y],[x,0,y],fm,1.0);
    // tavan (yalnız iç mekân)
    if(indoorG[idx(x,y)])pushQuad(a,[x,WALL_H,y],[x+1,WALL_H,y],[x+1,WALL_H,y+1],[x,WALL_H,y+1],uv(TI.ceil),0.55);
    // kapı lentosu (kapı hücresi üstü)
    if(doorAt(x,y)){
      const dm=uv(TI.stone);
      const top=1.34;

function bindMesh(m){

  gl.enableVertexAttribArray(A.aPos);
  gl.enableVertexAttribArray(A.aUV);
  gl.enableVertexAttribArray(A.aShade);
  gl.vertexAttribPointer(A.aPos,3,gl.FLOAT,false,24,0);
  gl.vertexAttribPointer(A.aUV,2,gl.FLOAT,false,24,12);

function drawMesh(m,model,tint,emissive,uvCell){
  gl.uniformMatrix4fv(U.uModel,false,model);
  gl.uniform4fv(U.uTint,tint);
  gl.uniform1f(U.uEmissive,emissive);
  if(uvCell)retexQuad(m,uvCell);
  gl.drawArrays(gl.TRIANGLES,0,m.n);
}

function retexQuad(m,cellUV){

let VP=null, camPos=[0,0,0];
function project(wx,wy,wz){ // dünya → ekran (UI için)
  const x=VP[0]*wx+VP[4]*wy+VP[8]*wz+VP[12];
  const y=VP[1]*wx+VP[5]*wy+VP[9]*wz+VP[13];
  const w=VP[3]*wx+VP[7]*wy+VP[11]*wz+VP[15];
  if(w<=0.01)return null;
  return [(x/w*0.5+0.5)*uiW,(1-(y/w*0.5+0.5))*uiH,w];
}
function renderWorld(t){

  camPos=[px,eyeY,pz];
  const view=mLookAt(px,eyeY,pz,px+fx,eyeY+fy,pz+fz);
  const proj=mPersp(1.05,asp,0.05,120);

  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,lightTex);gl.uniform1i(U.uLight,1);

  }
  // devriyeler (kutu-gövde low-poly)
  for(const g of guards)drawGuard(g,t);
  for(const b of bodies)drawBody(b);
  // loot mücevherleri (mobilya üstündekiler yüksekten süzülür)
  bindMesh(meshOcta);
  for(const l of loots)if(!l.taken){
    const bobY=0.06*Math.sin(t*2.2+l.x);
    const m=mMul(mTrans(l.x+0.5,0.12+l.h+bobY,l.y+0.5),mMul(mRotY(t*1.4+l.x),mScale(0.16,0.24,0.16)));
    drawMesh(meshOcta,m,l.big?[1,0.92,0.55,1]:[1,0.84,0.42,1],0.55);

    const m=mMul(mTrans(p.x/TILE,0.45,p.y/TILE),mScale(0.06,0.06,0.06));
    drawMesh(meshCube,m,p.kind==='pebble'?[0.75,0.75,0.82,1]:[1,0.75,0.3,1],p.kind==='flame'?1:0.2);
  }
  // alevler (çapraz billboard + additive parıltı)
  const flameH=li=>li.type==='torch'?0.72

  gl.depthMask(true);
  // ışık donanımları (sönmüş olsa da görünür)
  for(const li of lights){
    const wx=li.x+0.5,wz=li.y+0.5,ind=indoorG[idx(li.x,li.y)];
    bindMesh(meshCube);
    if(li.type==='lantern'){
      if(ind){ // tavandan zincirle asılı pirinç kandil
        drawMesh(meshCube,mMul(mTrans(wx,1.14,wz),mScale(0.016,0.37,0.016)),[0.30,0.30,0.36,1],0);
        bindMesh(meshOcta);
        drawMesh(meshOcta,mMul(mTrans(wx,0.94,wz),mScale(0.11,0.16,0.11)),[0.78,0.62,0.34,1],li.on?0.3:0.04);
      }else{ // direk feneri
        drawMesh(meshCube,mMul(mTrans(wx,0,wz),mScale(0.1,0.42,0.1)),[0.35,0.28,0.16,1],0);
        drawMesh(meshCube,mMul(mTrans(wx,0.38,wz),mScale(0.2,0.18,0.2)),[0.62,0.48,0.24,1],li.on?0.22:0.02);
      }
    }else if(li.type==='torch'){ // avlu mangalı
      drawMesh(meshCube,mMul(mTrans(wx,0,wz),mScale(0.06,0.58,0.06)),[0.30,0.24,0.14,1],0);
      bindMesh(meshOcta);
      drawMesh(meshOcta,mMul(mTrans(wx,0.52,wz),mScale(0.17,0.11,0.17)),[0.26,0.23,0.25,1],li.on?0.12:0);
    }else if(li.type==='candle'){
      const b=li.base||0;
      drawMesh(meshCube,mMul(mTrans(wx,b,wz),mScale(0.05,0.24,0.05)),[0.85,0.8,0.66,1],0);
      drawMesh(meshCube,mMul(mTrans(wx,b,wz),mScale(0.12,0.02,0.12)),[0.66,0.52,0.30,1],0);
    }else if(li.type==='placed'){ // fanustan bırakılan alev: pişmiş toprak kandil
      drawMesh(meshCube,mMul(mTrans(wx,0,wz),mScale(0.09,0.05,0.09)),[0.62,0.40,0.26,1],0.1);
    }
  }
  // şadırvan suyu (hafif kırpışan iki kare)
  const wmesh=((t*3)|0)%2?meshWaterA:meshWaterB;
  bindMesh(wmesh);
  drawMesh(wmesh,mMul(mTrans(28,0.22,27),mScale(1.56,1,1.56)),[1,1,1,0.94],0.26);
}
function drawGuard(g,t){
  // İncelen prizma uzuvlar + doku giydirme; yürüyüşte diz/dirsek bükülür,
  // devriyede asa, alarm/aramada çekilmiş kılıç (poz yumuşak geçişli).
  const wx=g.x/TILE, wz=g.y/TILE;
  const mv=g.moving?1:0, ph=g.bob*1.6;
  const swing=mv?Math.sin(ph)*0.52:0;
  g.poseT+=(((g.state==='alert'||g.state==='search')?1:0)-g.poseT)*Math.min(1,gDt*5);
  const pT=g.poseT;
  const bobY=mv*Math.abs(Math.sin(ph))*0.028;
  const base=mMul(mTrans(wx,bobY,wz),mRotY(-g.dir-Math.PI/2)); // yerel -z = baktığı yön
  const D=(mesh,local,tint,em)=>{bindMesh(mesh);drawMesh(mesh,mMul(base,local),tint||GP_W,em||0);};
  // bacaklar: kalça salınımı + öne alınan bacakta diz bükülmesi
  const bendA=mv?Math.max(0,Math.sin(ph+0.8))*0.75:0.04;
  const bendB=mv?Math.max(0,Math.sin(ph+Math.PI+0.8))*0.75:0.04;
  D(GP.thigh,mm(mTrans(-0.10,0.50,0),mRotX(swing)));
  D(GP.shin, mm(mTrans(-0.10,0.50,0),mRotX(swing),mTrans(0,-0.26,0),mRotX(bendA)));
  D(GP.thigh,mm(mTrans(0.10,0.50,0),mRotX(-swing)));
  D(GP.shin, mm(mTrans(0.10,0.50,0),mRotX(-swing),mTrans(0,-0.26,0),mRotX(bendB)));
  // üst gövde: kalçadan hafif öne eğim + yürüyüş yalpası
  const TOPm=mm(base,mTrans(0,0.50,0),mRotX(mv*0.06+pT*0.10),mRotZ(mv*Math.sin(ph)*0.03));
  const DT=(mesh,local,tint,em)=>{bindMesh(mesh);drawMesh(mesh,mMul(TOPm,local),tint||GP_W,em||0);};
  DT(GP.skirt,mTrans(0,0.02,0));
  DT(GP.torso,mIdent());
  DT(GP.sash,mTrans(0,0.005,0));
  // kafa: şüphede sağa sola tarar, devriyede ağır süzülür
  const hy=(g.state==='suspect'||g.state==='search')?Math.sin(t*3.2+g.bob)*0.5
          :(!mv?Math.sin(t*0.6+g.bob)*0.22:Math.sin(ph)*0.05);
  DT(GP.head,mm(mTrans(0,0.305,0),mRotY(hy)));
  DT(GP.bork,mm(mTrans(0,0.505,0),mRotY(hy)));
  // kollar (omuz TOP-yerel y=0.26 → dünya ~0.76)
  const swL=-swing*0.75;
  const upL=mm(mTrans(-0.265,0.26,0),mRotZ(0.10),mRotX(swL));
  DT(GP.armU,upL);
  DT(GP.armL,mm(upL,mTrans(0,-0.20,0),mRotX(-0.28-Math.max(0,-swing)*0.35)));
  const swR=(1-pT)*(-swing*0.15-0.22)+pT*(-0.85); // asa tutuşu → kılıç kaldırma
  const elR=(1-pT)*(-0.28)+pT*(-0.50);
  const upR=mm(mTrans(0.265,0.26,0),mRotZ(-0.10),mRotX(swR));
  DT(GP.armU,upR);
  const loR=mm(upR,mTrans(0,-0.20,0),mRotX(elR));
  DT(GP.armL,loR);
  // sol kalçada kın
  DT(GP.scab,mm(mTrans(-0.20,0.06,0.03),mRotX(0.5),mRotZ(0.18)));
  if(pT>0.5){ // kılıç çekilmiş: namlu dikeye yakın, hafif öne
    DT(GP.sword,mm(loR,mTrans(0,-0.20,-0.02),mRotX(-(swR+elR)-0.30)),GP_W,0.12);
  }else{      // devriye asası: yere dik, ucu tabana değer
    DT(GP.asa,mm(loR,mTrans(0,-0.20,0),mRotX(-(swR+elR))));
  }
  // UI için baş konumu
  g.scr=project(wx,1.35+bobY,wz);
}
function drawBody(b){ // bayıltılmış ases: sırtüstü, börk yana yuvarlanmış
  const wx=b.x/TILE, wz=b.y/TILE;
  const base=mm(mTrans(wx,0.10,wz),mRotY(-b.dir),mRotX(-1.42));
  const D=(mesh,local,tint,em)=>{bindMesh(mesh);drawMesh(mesh,mMul(base,local),tint||GP_W,em||0);};
  D(GP.thigh,mm(mTrans(-0.10,0.50,0),mRotZ(0.10)));
  D(GP.shin, mm(mTrans(-0.10,0.50,0),mRotZ(0.10),mTrans(0,-0.26,0)));
  D(GP.thigh,mm(mTrans(0.10,0.50,0),mRotZ(-0.10)));
  D(GP.shin, mm(mTrans(0.10,0.50,0),mRotZ(-0.10),mTrans(0,-0.26,0)));
  D(GP.skirt,mTrans(0,0.52,0));
  D(GP.torso,mTrans(0,0.50,0));
  D(GP.sash,mTrans(0,0.505,0));
  D(GP.head,mm(mTrans(0,0.805,0),mRotY(0.35)));
  const upL=mm(mTrans(-0.265,0.76,0),mRotZ(0.85));
  D(GP.armU,upL);D(GP.armL,mm(upL,mTrans(0,-0.20,0)));
  const upR=mm(mTrans(0.265,0.76,0),mRotZ(-0.65));
  D(GP.armU,upR);D(GP.armL,mm(upR,mTrans(0,-0.20,0)));
  // düşen börk ve asa
  bindMesh(GP.bork);
  drawMesh(GP.bork,mm(mTrans(wx+Math.cos(b.dir+1.2)*0.34,0.02,wz+Math.sin(b.dir+1.2)*0.34),mRotZ(1.35),mRotX(0.4)),GP_W,0);
  bindMesh(GP.asa);
  drawMesh(GP.asa,mm(mTrans(wx-Math.cos(b.dir+0.5)*0.30,0.03,wz-Math.sin(b.dir+0.5)*0.30),mRotY(b.dir*1.7),mRotX(Math.PI/2)),GP_W,0);
}

const ux=ui.getContext('2d');
let uiW=0,uiH=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  uiW=innerWidth;uiH=innerHeight;
  const g3=Math.min(DPR,1.5); // 3D katman keskinliği
  glc.width=Math.floor(innerWidth*g3);
  glc.height=Math.floor(innerHeight*g3);
  ui.width=Math.floor(innerWidth*DPR);
  ui.height=Math.floor(innerHeight*DPR);
  ux.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
const F_DISP='Georgia, "Times New Roman", serif';
const F_UI='"Segoe UI", system-ui, -apple-system, sans-serif';
function text(str,x,y,size,col,align,font,weight){
  ux.font=(weight||'600')+' '+size+'px '+(font||F_UI);
  ux.textAlign=align||'center';
  ux.shadowColor='rgba(0,0,0,0.85)';ux.shadowBlur=6;ux.shadowOffsetY=1;
  ux.fillStyle=col;ux.fillText(str,x,y);
  ux.shadowBlur=0;ux.shadowOffsetY=0;
}
function panel(x,y,w,h,r){
  ux.beginPath();
  ux.moveTo(x+r,y);ux.arcTo(x+w,y,x+w,y+h,r);ux.arcTo(x+w,y+h,x,y+h,r);
  ux.arcTo(x,y+h,x,y,r);ux.arcTo(x,y,x+w,y,r);ux.closePath();
}
function drawStarsUI(t){
  // açık havada, ufkun yeterince üstündeki yönlerde yıldız serpintisi
  if(indoorG[idx(Math.floor(player.x/TILE),Math.floor(player.y/TILE))])return;
  const px=player.x/TILE, pz=player.y/TILE, ey=player.crouch?EYE_CROUCH:EYE;
  for(const s of STAR_DIRS){
    const p=project(px+s.x*90,ey+s.y*90,pz+s.z*90);
    if(!p||p[0]<0||p[0]>uiW||p[1]<0||p[1]>uiH)continue;
    const a=0.25+0.55*Math.abs(Math.sin(t*0.8+s.tw));
    ux.fillStyle='rgba(205,218,255,'+a+')';
    ux.fillRect(p[0],p[1],s.s,s.s);
  }
}
function drawHUD(t){
  ux.clearRect(0,0,uiW,uiH);
  drawStarsUI(t);
  // vinyet
  const vg=ux.createRadialGradient(uiW/2,uiH/2,uiH*0.48,uiW/2,uiH/2,uiH*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,3,8,0.26)');
  ux.fillStyle=vg;ux.fillRect(0,0,uiW,uiH);
  // devriye durum + laf balonları (3D projeksiyon)
  for(const g of guards){
    if(!g.scr)continue;
    const [sx,sy]=g.scr;
    if(sx<-50||sx>uiW+50)continue;
    if(g.state==='suspect'||g.state==='search')text('?',sx,sy-8,22,'#ffd75e','center',F_DISP,'700');
    if(g.state==='alert')text('!',sx,sy-8,24,'#ff5a48','center',F_DISP,'700');
    if(g.barkT>0&&g.bark&&g.scr[2]<14){
      ux.font='500 14px '+F_UI;
      const w=ux.measureText(g.bark).width+18;
      ux.fillStyle='rgba(10,10,18,0.82)';
      panel(sx-w/2,sy-46,w,24,7);ux.fill();
      ux.strokeStyle='rgba(200,180,140,0.25)';ux.stroke();
      text(g.bark,sx,sy-29,14,'#e9e2d0');
    }
  }
  // alarm kızıllığı
  if(guards.some(g=>g.state==='alert')){
    const p=0.5+0.5*Math.sin(t*6);
    ux.fillStyle='rgba(255,50,30,'+(0.04+0.05*p)+')';ux.fillRect(0,0,uiW,uiH);
  }
  // fark edilme ibresi
  let mx=0;for(const g of guards)mx=Math.max(mx,g.visNow>0?g.meter:0);
  if(mx>0.03){
    ux.fillStyle='rgba(10,10,16,0.65)';
    panel(uiW/2-60,uiH/2-58,120,10,5);ux.fill();
    ux.fillStyle=mx>0.7?'#ff5a48':'#ffd75e';

  }
  // crosshair
  ux.fillStyle='rgba(233,226,208,0.85)';
  ux.fillRect(uiW/2-1.5,uiH/2-1.5,3,3);
  // etkileşim / kanal
  const tgt=findTarget();
  if(player.channel){
    ux.fillStyle='rgba(10,10,18,0.8)';
    panel(uiW/2-120,uiH/2+28,240,40,9);ux.fill();
    ux.strokeStyle='rgba(255,190,100,0.35)';ux.stroke();
    text('Alevi çalıyorsun…',uiW/2,uiH/2+45,14,'#ffe6ae');
    ux.fillStyle='rgba(255,255,255,0.14)';
    panel(uiW/2-100,uiH/2+52,200,7,3);ux.fill();
    ux.fillStyle='#ffcf7a';
    panel(uiW/2-100,uiH/2+52,200*Math.min(1,player.channel.t),7,3);ux.fill();
  }else if(tgt){
    const txt = tgt.k==='loot' ? 'E — '+tgt.o.name+' ('+tgt.o.val+' akçe)'
             : tgt.k==='door' ? (tgt.o.open?'E — kapıyı kapa':'E — kapıyı aç')
             : (player.flames>=2?'Fanus dolu':'E basılı tut — alevi fanusla çal');
    ux.font='600 15px '+F_UI;
    const w=ux.measureText(txt).width+24;
    ux.fillStyle='rgba(10,10,18,0.8)';
    panel(uiW/2-w/2,uiH/2+28,w,30,8);ux.fill();
    ux.strokeStyle='rgba(200,180,140,0.3)';ux.stroke();
    text(txt,uiW/2,uiH/2+48,15,'#e9e2d0');
  }
  // FANUS (sağ alt) — cam fanus içinde gerçek alevler
  const bob=player.moving?Math.sin(player.bobT)*6:0;
  const fx=uiW-150,fy=uiH-170+bob;
  if(player.flames>0){
    const gg=ux.createRadialGradient(fx+55,fy+70,10,fx+55,fy+70,110);
    gg.addColorStop(0,'rgba(255,180,90,0.20)');gg.addColorStop(1,'rgba(255,180,90,0)');

  }
  ux.strokeStyle='rgba(200,215,235,0.5)';ux.lineWidth=3;
  ux.beginPath();ux.arc(fx+55,fy+62,44,Math.PI*0.98,Math.PI*2.02);ux.stroke();
  ux.strokeStyle='rgba(200,215,235,0.18)';
  ux.beginPath();ux.arc(fx+55,fy+62,44,0,Math.PI);ux.stroke();
  ux.strokeStyle='rgba(255,255,255,0.35)';ux.lineWidth=2;

  ux.fillStyle='#7a5c2e';
  panel(fx+8,fy+100,94,16,6);ux.fill();
  ux.fillStyle='#8f6c36';
  panel(fx+14,fy+94,82,8,4);ux.fill();
  ux.fillStyle='#7a5c2e';panel(fx+47,fy+6,16,10,3);ux.fill(); // halka
  for(let i=0;i<player.flames;i++){
    const flx=fx+37+i*26, fly=fy+60+Math.sin(t*10+i*2.4)*3;
    const fg=ux.createRadialGradient(flx,fly+14,2,flx,fly+10,20);
    fg.addColorStop(0,'#fff3c8');fg.addColorStop(0.4,'#ffcf6a');fg.addColorStop(0.8,'rgba(240,138,42,0.8)');fg.addColorStop(1,'rgba(200,80,20,0)');
    ux.fillStyle=fg;
    ux.beginPath();ux.moveTo(flx,fly-16+Math.sin(t*13+i)*2);
    ux.quadraticCurveTo(flx+11,fly+2,flx+8,fly+12);
    ux.quadraticCurveTo(flx+5,fly+20,flx,fly+22);
    ux.quadraticCurveTo(flx-5,fly+20,flx-8,fly+12);
    ux.quadraticCurveTo(flx-11,fly+2,flx,fly-16+Math.sin(t*13+i)*2);
    ux.fill();
  }
  // alt bilgi barı
  const barY=uiH-64;
  ux.fillStyle='rgba(8,10,18,0.72)';

  text(player.loot+' / '+GOAL+' akçe',64,barY+31,18,'#ffd76a','left',F_UI,'700');
  text('çakıl '+player.pebble,230,barY+30,15,player.pebble>0?'#c9ccd8':'#5a5e6e','left');
  text('fanus '+player.flames+'/2',300,barY+30,15,player.flames>0?'#ffcf7a':'#5a5e6e','left');

  ux.fillStyle=gemG;
  panel(-13,-13,26,26,5);ux.fill();
  ux.strokeStyle='rgba(180,200,230,0.7)';ux.lineWidth=2;ux.stroke();

  text(L<0.33?'gölgedesin':L<0.6?'yarı gölge':'IŞIKTASIN',gx,uiH-12,13,L<0.33?'#8fa3bf':L<0.6?'#cbb98a':'#ffe6ae');
  // görev satırı
  text(player.loot>=GOAL?'Kese doldu — kuzeydeki bahçe kapısına git!':'Görev: Paşa\'nın konağından '+GOAL+' akçe topla',uiW/2,34,16,'rgba(222,228,240,0.92)','center',F_DISP,'600');
  if(!document.pointerLockElement)
    text('fareyle bakmak için tıkla · TAB harita · E etkileşim',uiW/2,58,14,'rgba(255,215,106,0.9)');

  });

  if(keys.Tab)drawMap();
}
function drawMap(){

  ux.beginPath();ux.moveTo(kx,ky-18);ux.lineTo(kx-4,ky-11);ux.lineTo(kx+4,ky-11);ux.closePath();ux.fill();
  text('K',kx,ky+11,10,'#5c4a30','center',F_UI,'700');
  const pxm=ox+player.x/TILE*sc, pym=oy+player.y/TILE*sc;
  ux.fillStyle='#7a2020';
  ux.beginPath();
  ux.moveTo(pxm+Math.cos(player.ang)*9,pym+Math.sin(player.ang)*9);
  ux.lineTo(pxm+Math.cos(player.ang+2.5)*6,pym+Math.sin(player.ang+2.5)*6);
  ux.lineTo(pxm+Math.cos(player.ang-2.5)*6,pym+Math.sin(player.ang-2.5)*6);
  ux.closePath();ux.fill();
  text('Paşa Rüstem Konağı — kat planı',ox+mw/2,oy+mh+9,13,'#4a3a28','center',F_DISP,'600');
}
function drawTitle(t){
  ux.clearRect(0,0,uiW,uiH);
  const bg=ux.createLinearGradient(0,0,0,uiH);
  bg.addColorStop(0,'#070912');bg.addColorStop(0.6,'#0d1120');bg.addColorStop(1,'#131a2e');
  ux.fillStyle=bg;ux.fillRect(0,0,uiW,uiH);
  for(let i=0;i<110;i++){
    const x=hashN(i,7)*uiW, y=hashN(i,13)*uiH*0.55;
    ux.fillStyle='rgba(205,218,255,'+(0.12+0.5*Math.abs(Math.sin(t*0.7+i)))+')';
    ux.fillRect(x,y,1.6,1.6);
  }
  // ay
  const mg=ux.createRadialGradient(uiW*0.82,uiH*0.16,10,uiW*0.82,uiH*0.16,120);
  mg.addColorStop(0,'rgba(238,232,210,0.35)');mg.addColorStop(1,'rgba(238,232,210,0)');
  ux.fillStyle=mg;ux.fillRect(uiW*0.82-130,uiH*0.16-130,260,260);
  ux.fillStyle='#eee8d2';ux.beginPath();ux.arc(uiW*0.82,uiH*0.16,34,0,7);ux.fill();
  ux.fillStyle='#0a0d18';ux.beginPath();ux.arc(uiW*0.82-13,uiH*0.16-9,29,0,7);ux.fill();
  // silüet damlar
  ux.fillStyle='#0a0c18';
  const n=12;
  for(let i=0;i<=n;i++){
    const h=uiH*(0.62+hashN(i,3)*0.12);
    ux.fillRect(i*(uiW/n),h,uiW/n+2,uiH-h);
    ux.fillStyle='rgba(255,176,80,'+(0.25+0.3*hashN(i,9))+')';
    ux.fillRect(i*(uiW/n)+uiW/n*0.4,h+26,5,8);
    ux.fillStyle='#0a0c18';
  }
  // saat kulesi
  ux.fillStyle='#0e1020';ux.fillRect(uiW*0.12,uiH*0.34,64,uiH*0.5);
  ux.fillRect(uiW*0.12-8,uiH*0.32,80,20);
  ux.fillStyle='#ffcf7a';ux.beginPath();ux.arc(uiW*0.12+32,uiH*0.42,22,0,7);ux.fill();
  ux.strokeStyle='#3a2c18';ux.lineWidth=3;
  ux.beginPath();ux.moveTo(uiW*0.12+32,uiH*0.42);ux.lineTo(uiW*0.12+32,uiH*0.42-15);
  ux.moveTo(uiW*0.12+32,uiH*0.42);ux.lineTo(uiW*0.12+42,uiH*0.42+6);ux.stroke();
  // başlık bloğu — dikey oranlarla (küçük pencerede de sığar)
  text('GÖLGE OYUNU',uiW/2,uiH*0.24,Math.min(84,uiW*0.09,uiH*0.15),'#ece5d3','center',F_DISP,'700');
  ux.letterSpacing='6px';
  text('—  K U Z G U N  —',uiW/2,uiH*0.24+uiH*0.075,Math.min(20,uiH*0.038),'#ffb347','center',F_UI,'600');
  ux.letterSpacing='0px';
  text('birinci şahıs 3D prototip',uiW/2,uiH*0.24+uiH*0.125,Math.min(16,uiH*0.032),'rgba(190,200,220,0.85)','center',F_DISP,'400');
  const lore=[
    '"Sayeban\'da gece iki tür insana aittir: aseslere ve benim gibilere."',
    '"Paşa Rüstem\'in konağı bu gece kalabalık; kesesi de öyle."',
    '"Ve unutma: ışık düşmanın değil, malındır. Çal onu."'
  ];
  const loreY=uiH*0.46, loreH=Math.min(26,uiH*0.05);
  lore.forEach((l,i)=>text(l,uiW/2,loreY+i*loreH,Math.min(16,uiH*0.031),'rgba(200,209,228,0.9)','center',F_DISP,'400'));
  // kontroller — iki sütun
  const cy=uiH*0.63, rowH=Math.min(26,uiH*0.046), colL=uiW/2-260, colR=uiW/2+20;
  const fs=Math.min(14,uiH*0.028);
  const ctrlL=[['FARE','bak (tıklayıp kilitle)'],['W A S D','yürü / yan adım'],['SHIFT','koş — gürültülü!'],['C','çömel'],['TAB','kat planı'],['1 / 2','parlaklık ayarı']];
  const ctrlR=[['E','al · kapı'],['E basılı','alevi fanusla ÇAL'],['SOL TIK','alevi bırak (yeniden yanar)'],['Q / SAĞ TIK','çakıl fırlat'],['SPACE','arkadan bayılt'],['M · R','ses · yeniden başla']];
  [[ctrlL,colL],[ctrlR,colR]].forEach(([list,cx])=>{
    list.forEach(([k,v],i)=>{
      text(k,cx+90,cy+i*rowH,fs,'#ffd76a','right',F_UI,'700');
      text(v,cx+104,cy+i*rowH,fs,'rgba(222,228,240,0.9)','left',F_UI,'400');
    });
  });
  if(Math.sin(t*3.4)>-0.25)
    text('— ENTER: Geceye Başla —',uiW/2,uiH-Math.max(46,uiH*0.09),Math.min(22,uiH*0.042),'#ffd76a','center',F_DISP,'700');
  text('Thief: The Dark Project ruhuyla · v2: dokulu devriyeler, ay ışığı pencereleri, liman ambiyansı · M ses · R yeniden',uiW/2,uiH-16,Math.min(13,uiH*0.026),'rgba(140,152,176,0.8)');
}
function drawEnd(win,t){
  ux.fillStyle=win?'rgba(6,12,8,0.82)':'rgba(16,5,7,0.84)';
  ux.fillRect(0,0,uiW,uiH);
  text(win?'SIRRA KADEM BASTIN':'YAKALANDIN',uiW/2,uiH*0.32,Math.min(64,uiW*0.07),win?'#9fe3a1':'#ff5a48','center',F_DISP,'700');
  text(win?'"Paşa sabaha kadar fark etmez. Sabah da… benim meselem değil."'
          :'"Böcekbaşı seninle bizzat ilgilenecekmiş. Ne şeref." — Ases',
       uiW/2,uiH*0.32+42,17,'rgba(200,209,228,0.9)','center',F_DISP,'400');
  const mins=Math.floor(timeInMission/60),secs=Math.floor(timeInMission%60);
  const total=loots.reduce((a,l)=>a+l.val,0);
  const rows=[
    ['Çalınan',player.loot+' / '+total+' akçe'],
    ['Süre',mins+' dk '+secs+' sn'],
    ['Alarm',player.seen+' kez'],
    ['Bayıltma',player.ko+'']
  ];
  rows.forEach(([k,v],i)=>{
    text(k,uiW/2-30,uiH*0.32+96+i*30,16,'rgba(160,172,196,0.9)','right');
    text(v,uiW/2-10,uiH*0.32+96+i*30,16,'#e9e2d0','left',F_UI,'700');
  });
  if(win){
    const rank=player.seen===0&&player.ko===0?'HAYALET':player.seen===0?'GÖLGE':player.seen<=2?'KUZGUN':'ACEMİ ÇIRAK';
    text('Derece: '+rank,uiW/2,uiH*0.32+232,28,'#ffd76a','center',F_DISP,'700');
    text(rank==='HAYALET'?'Hiç görülmedin, kimseye dokunmadın. Ustalık budur.':
         rank==='GÖLGE'?'Görülmedin. Bir dahaki sefere ellerin de temiz kalsın.':
         rank==='KUZGUN'?'İş bitti ama izin kaldı. Kuzgun daha iyisini yapar.':
         'Gürültülü bir geceydi. Sansar duysa güler.',uiW/2,uiH*0.32+262,15,'rgba(180,190,210,0.85)','center',F_DISP,'400');
  }
  text('R — tekrar dene      ENTER — başlık',uiW/2,uiH*0.32+310,17,'#c8d2e8');
}

// ---------------- Ana döngü ----------------
state='title';
let last=0, glFail=false;
try{ if(!glInit())glFail=true; }catch(e){ glFail=true; }
buildWorld();
if(glReady)meshStatic=buildStaticMesh();
function frame(ts){
  const t=ts/1000, dt=Math.min(0.05,(ts-last)/1000||0.016);
  last=ts; gDt=dt;
  if(glFail){
    ux.clearRect(0,0,uiW,uiH);
    ux.fillStyle='#0b0e1a';ux.fillRect(0,0,uiW,uiH);
    text('Tarayıcın WebGL desteklemiyor — prototip için güncel Chrome/Firefox gerekli.',uiW/2,uiH/2,16,'#e9e2d0');
    requestAnimationFrame(frame);return;
  }
  if(state==='play'){
    timeInMission+=dt;
    updatePlayer(dt);
    updateChannel(dt);
    for(const g of guards)updateGuard(g,dt);
    updateProjs(dt);
    updateAudio(dt);
    renderWorld(t);
    drawHUD(t);
  }else if(state==='title'){
    gl.clearColor(0.03,0.04,0.085,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    drawTitle(t);
  }else{
    renderWorld(t);
    drawEnd(state==='win',t);
  }
  requestAnimationFrame(frame);
}
resize();
if(glReady)uploadLightTex();
requestAnimationFrame(frame);
</script>
